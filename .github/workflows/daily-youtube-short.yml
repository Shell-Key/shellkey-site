# YouTube Shorts: 3 a day at the best times.
# Runs every hour; shorts/plan.mjs decides if this hour is one of today's 3
# posting times (testing all times first, then the 3 best). Each post records
# a portal demo, adds the voice, and uploads it. Results table: open any run.
# To post one right now: Actions > "Daily YouTube Short" > Run workflow.
name: Daily YouTube Short

on:
  schedule:
    - cron: "7,27,47 * * * *"   # every 20 minutes (GitHub often skips runs); the plan decides whether to post
  workflow_dispatch:
    inputs:
      product:
        description: "Product slug from shorts/products.json, or auto for the next one in line"
        default: "auto"
      privacy:
        description: "public, unlisted or private"
        default: "public"

permissions:
  contents: write            # only to save the posting log on the shorts-log branch

concurrency:
  group: youtube-shorts      # one run at a time, so two posts never collide
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Get the posting log
        uses: actions/checkout@v4
        with:
          ref: shorts-log
          path: shorts-log

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Plan (post now? best times?)
        id: plan
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node shorts/plan.mjs shorts-log

      - name: Install tools
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.post == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Record the demo and make the voice
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.post == 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          PRODUCT_IN: ${{ github.event.inputs.product }}
          PRODUCT_PLAN: ${{ steps.plan.outputs.product }}
        run: |
          P="$PRODUCT_IN"; if [ -z "$P" ] || [ "$P" = "auto" ]; then P="$PRODUCT_PLAN"; fi
          node shorts/record.mjs "$P" shorts-out

      - name: Build the Short (10 to 30 seconds)
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.post == 'true'
        run: python3 shorts/compose.py shorts-out

      - name: Keep a copy of the video
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            shorts-out/short.mp4
            shorts-out/youtube.json
          retention-days: 14

      - name: Post to YouTube
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.post == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: node shorts/upload.mjs shorts-out

      - name: Save the video for LinkedIn (download link for the CRM)
        id: video
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f shorts-out/posted.json ] || { echo "Not posted; skipping."; exit 0; }
          NAME="$(node -e 'const j=require("./shorts-out/job.json");process.stdout.write(j.slug)')-$(date -u +%Y%m%d-%H%M).mp4"
          cp shorts-out/short.mp4 "$NAME"
          gh release view shorts >/dev/null 2>&1 || gh release create shorts --title "Shorts videos" --notes "MP4s of the daily YouTube Shorts, for LinkedIn video posts. Made by the GitHub job." --latest=false
          gh release upload shorts "$NAME" --clobber
          echo "url=https://github.com/${{ github.repository }}/releases/download/shorts/$NAME" >> "$GITHUB_OUTPUT"
          # keep the last 60 videos
          gh release view shorts --json assets -q '.assets | sort_by(.createdAt) | reverse | .[60:] | .[].name' | while read -r old; do gh release delete-asset shorts "$old" -y; done

      - name: Add it to the posting log
        if: github.event_name == 'workflow_dispatch' || steps.plan.outputs.post == 'true'
        env:
          VIDEO_URL: ${{ steps.video.outputs.url }}
        run: node shorts/log_add.mjs shorts-out shorts-log "${{ github.event_name == 'workflow_dispatch' && 'manual' || steps.plan.outputs.slot }}"

      - name: Save the posting log
        if: always()
        working-directory: shorts-log
        run: |
          git config user.name "Shell Key Shorts"
          git config user.email "support@shellkey.company"
          git add log.json
          if git diff --cached --quiet; then echo "Log unchanged."; exit 0; fi
          git commit -qm "Shorts log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin shorts-log && git push -q origin HEAD:shorts-log && exit 0; sleep 5; done
          exit 1
