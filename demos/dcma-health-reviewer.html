    var el = document.getElementById('ctx'); if (!el || !S.model) return;
    var pj = S.model.project;
    el.textContent = (pj.code || pj.name) + ' · Data date ' + U.fmt(pj.dataDay) + ' · ' + (S.isSample ? 'Sample schedule' : S.model.fileName);
    el.title = (pj.name || '') + ' — ' + S.model.fileName;
  };
  A.banner = function () {
    var demo = SK.CONFIG.edition === 'demo';
    if (S.isSample && demo) return '<div class="banner info" role="note"><span class="b-ico" aria-hidden="true">i</span><p><b>Demo edition — sample data only.</b> Every screen shows a fictional schedule (Bayou Ridge Compressor Station). To review your own P6 or MS Project schedules, subscribe for $' + SK.CONFIG.pricing.monthly + '/month and you will receive the subscriber edition. <button class="btn sm ghost" data-go="pricing" type="button">See the plan</button></p></div>';
    if (S.isSample) return '<div class="banner info" role="note"><span class="b-ico" aria-hidden="true">i</span><p><b>Sample schedule loaded.</b> Open <button class="btn sm ghost" data-go="load" type="button">Load Schedule</button> to review your own file.</p></div>';
    return '<div class="banner info" role="note"><span class="b-ico" aria-hidden="true">i</span><p><b>' + U.esc(S.model.fileName) + '</b> was read on this device. It was not uploaded anywhere.</p></div>';
  };

  /* ---------------- NAVIGATION ---------------- */
  A.go = function (id, opts) {
    if (!A.TITLES[id]) id = 'dash';
    SK.voice.stop();
    S.screen = id;
    document.querySelectorAll('.nav button[data-screen]').forEach(function (b) { b.toggleAttribute('aria-current', false); if (b.dataset.screen === id) b.setAttribute('aria-current', 'page'); });
    document.getElementById('page-title').textContent = A.TITLES[id];
    document.title = A.TITLES[id] + ' — ' + SK.CONFIG.product;
    var main = document.getElementById('view');
    main.innerHTML = '';
    SK.screens[id](main, opts || {});
    document.body.classList.remove('nav-open');
    if (!(opts && opts.keepScroll)) window.scrollTo(0, 0);
    if (opts && opts.focus !== false) { var h = document.getElementById('page-title'); h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    try { history.replaceState(null, '', '#' + id); } catch (e) { }
  };
  A.rerender = function () { A.go(S.screen, { keepScroll: true, focus: false }); };

  /* ---------------- APPEARANCE ---------------- */
  A.applyLook = function () {
    var r = document.documentElement, L = S.look;
    r.setAttribute('data-theme', L.theme);
    r.setAttribute('data-scale', L.scale);
    r.setAttribute('data-density', L.density);
    r.setAttribute('data-nav', L.nav);
    if (L.accent && L.theme !== 'contrast') { r.style.setProperty('--accent', L.accent); r.style.setProperty('--on-accent', A.onColor(L.accent)); }
    else { r.style.removeProperty('--accent'); r.style.removeProperty('--on-accent'); }
    document.querySelectorAll('[data-brand-logo]').forEach(function (img) { img.src = L.logo || SK.LOGO; });
    var nm = document.getElementById('brand-company'); if (nm) nm.textContent = L.company || SK.CONFIG.company;
    A.saveSettings();
  };
  /* pick dark or white text for any accent color (WCAG luminance) */
  A.onColor = function (hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#0a1320';
    var n = parseInt(m[1], 16), c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    var L = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    return (L + 0.05) / (0.0066 + 0.05) >= 1.05 / (L + 0.05) ? '#0a1320' : '#ffffff';  /* 0.0066 = luminance of #0a1320 */
  };

  /* ---------------- TOASTS ---------------- */
  A.toast = function (msg, kind) {
    var box = document.getElementById('toasts'), t = document.createElement('div');
    t.className = 'toast ' + (kind || ''); t.setAttribute('role', kind === 'bad' ? 'alert' : 'status'); t.innerHTML = msg;
    box.appendChild(t); setTimeout(function () { t.remove(); }, kind === 'bad' ? 9000 : 5000);
  };

  /* ---------------- EXPORTS (respect the edition gate) ---------------- */
  A.locked = function (what) {
    A.toast('<b>' + what + ' is locked for your own files in the demo.</b> It is included in the $' + SK.CONFIG.pricing.monthly + '/month plan. The sample schedule shows exactly what you get.', 'warn');
  };
  A.fileBase = function () {
    var pj = S.model.project;
    return (pj.code || 'Schedule').replace(/[^A-Za-z0-9_-]+/g, '_') + '_DD' + U.iso(pj.dataDay).replace(/-/g, '');
  };
  A.exportRows = function (kind, sheetName, rows, numeric, widths) {
    if (!SK.can('export')) return A.locked('Exporting');
    var name = A.fileBase() + '_' + sheetName.replace(/\s+/g, '');
    if (kind === 'csv') U.download('﻿' + U.toCSV(rows), name + '.csv', 'text/csv');
    else U.download(U.xlsxBlob([{ name: sheetName, rows: rows, numeric: numeric, widths: widths }]), name + '.xlsx');
    A.toast('Downloaded ' + U.esc(name + (kind === 'csv' ? '.csv' : '.xlsx')) + '.', 'good');
  };
  A.copyTSV = function (rows, label) {
    var text = U.toCSV(rows, '\t');
    function ok() { A.toast('Copied ' + (rows.length - 1) + ' rows. Paste into Excel or a P6 spreadsheet view — each value lands in its own cell.', 'good'); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? ok() : A.toast('Copy was blocked by the browser. Use Export Excel instead.', 'warn'); } catch (e) { A.toast('Copy was blocked by the browser. Use Export Excel instead.', 'warn'); }
      ta.remove();
    }
  };

  /* ---------------- ACTIVITY DRAWER ---------------- */
  A.openActivity = function (key) {
    var a = S.model.byKey[key]; if (!a) return;
    var dr = document.getElementById('drawer'), sc = document.getElementById('drawer-scrim');
    A._drawerOpener = A._drawerOpener || document.activeElement;
    var run = S.R.cp.base.res[key], pj = S.model.project;
    var probs = S.R.fixes.filter(function (f) { return f.key === key; });
    var spoken = a.id + ', ' + a.name + '. ' + (probs.length ? probs.map(function (f) { return f.check + '. ' + f.why + ' What to do: ' + f.what; }).join(' ') : 'No problems were found on this activity.');
    function relRows(list, side) {
      if (!list.length) return '<p class="muted small">None</p>';
      return '<div class="table-wrap" style="max-height:240px"><table class="data"><thead><tr><th>Activity</th><th>Name</th><th>Type</th><th class="num">Lag</th></tr></thead><tbody>' +
        list.map(function (r) { var o = S.model.byKey[side === 'p' ? r.pred : r.succ]; return '<tr class="clickable" data-key="' + o.key + '" tabindex="0"><td class="mono nowrap">' + U.esc(o.id) + '</td><td>' + U.esc(o.name) + '</td><td>' + r.type + '</td><td class="num">' + (r.lag ? (r.lag > 0 ? '+' : '') + (Math.round(r.lag * 10) / 10) + 'd' : '0') + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    var cstr = a.cstr.map(function (c) { return (c.label || SK.parsers.CSTR_LABEL[c.type] || c.type) + ' ' + U.fmt(c.day) + (SK.parsers.HARD[c.type] ? ' (hard)' : ''); }).join('; ') || 'None';
    dr.innerHTML = '<div class="drawer-head"><div style="flex:1;min-width:0"><div class="mono small muted sel">' + U.esc(a.id) + '</div><h2 id="drawer-title" class="sel">' + U.esc(a.name) + '</h2><div class="small muted">' + U.esc(a.wbsPath || '') + '</div></div><button class="btn icon-btn ghost" id="drawer-close" aria-label="Close details" type="button">✕</button></div>' +
      '<div class="drawer-body">' +
      '<h3 style="margin-bottom:8px">Problems found (' + probs.length + ')</h3>' +
      (probs.length ? probs.map(function (f) { return '<div class="card nest" style="margin-bottom:8px;padding:12px"><div class="row"><span class="badge p' + f.pri + '">P' + f.pri + '</span><b>' + U.esc(f.check) + '</b></div><p class="sel" style="margin:8px 0 4px">' + U.esc(f.what) + '</p><p class="small muted sel" style="margin:0">' + U.esc(f.why) + '</p></div>'; }).join('') : '<p class="muted">No problems were found on this activity.</p>') +
      '<button class="btn sm" id="drawer-read" type="button" style="margin:4px 0 14px">🔊 Read aloud</button>' +
      '<dl class="kv">' +
      '<dt>Contractor</dt><dd>' + U.esc(a.contractor || '—') + '</dd>' +
      '<dt>Type / status</dt><dd>' + ({ task: 'Task', start: 'Start milestone', finish: 'Finish milestone', loe: 'Level of effort', wbs: 'WBS summary' }[a.type]) + ' · ' + ({ NS: 'Not started', IP: 'In progress', C: 'Complete' }[a.status]) + ' · ' + Math.round(a.pct * 100) + '%</dd>' +
      '<dt>Duration</dt><dd>' + Math.round(a.origDur * 10) / 10 + 'd original · ' + Math.round(a.remDur * 10) / 10 + 'd remaining</dd>' +
      '<dt>Current dates</dt><dd>' + U.fmt(a.start) + ' → ' + U.fmt(a.finish) + '</dd>' +
      '<dt>Actual dates</dt><dd>' + (a.actStart != null ? U.fmt(a.actStart) : '—') + ' → ' + (a.actFinish != null ? U.fmt(a.actFinish) : '—') + '</dd>' +
      '<dt>Baseline dates</dt><dd>' + (a.blStart != null ? U.fmt(a.blStart) + ' → ' + U.fmt(a.blFinish) : '—') + '</dd>' +
      '<dt>Total float (file)</dt><dd class="' + (a.tf < -0.05 ? 'neg' : '') + '">' + (a.tf == null ? '—' : Math.round(a.tf * 10) / 10 + ' days') + '</dd>' +
      '<dt>Float (check engine)</dt><dd>' + (run && run.tf != null ? run.tf + ' days' : '—') + '</dd>' +
      '<dt>Constraints</dt><dd>' + U.esc(cstr) + '</dd>' +
      (a.budH || a.budC ? '<dt>Hours</dt><dd>' + U.num(a.budH) + ' budget · ' + U.num(a.actH) + ' actual · ' + U.num(a.remH) + ' remaining</dd><dt>Cost</dt><dd>' + U.money(a.budC) + ' budget · ' + U.money(a.actC) + ' actual · ' + U.money(a.remC) + ' remaining</dd>' : '<dt>Resources</dt><dd>None</dd>') +
      '</dl>' +
      '<h3 style="margin:10px 0 6px">Predecessors</h3>' + relRows(a.preds, 'p') + (a.extPred ? '<p class="small muted">Plus ' + a.extPred + ' link(s) from another project.</p>' : '') +
      '<h3 style="margin:14px 0 6px">Successors</h3>' + relRows(a.succs, 's') +
      '</div>';
    dr.classList.add('open'); sc.style.display = 'block';
    dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true'); dr.setAttribute('aria-labelledby', 'drawer-title');
    SK.voice.toggleButton(dr.querySelector('#drawer-read'), function () { return spoken; });
    dr.querySelector('#drawer-close').onclick = A.closeDrawer;
    dr.querySelectorAll('tr[data-key]').forEach(function (tr) {
      tr.onclick = function () { A.openActivity(tr.dataset.key); };
      tr.onkeydown = function (e) { if (e.key === 'Enter') A.openActivity(tr.dataset.key); };
    });
    dr.querySelector('#drawer-close').focus();
  };
  A.closeDrawer = function () {
    var dr = document.getElementById('drawer');
    if (!dr.classList.contains('open')) return;
    SK.voice.stop();
    dr.classList.remove('open'); document.getElementById('drawer-scrim').style.display = 'none';
    if (A._drawerOpener && document.body.contains(A._drawerOpener)) A._drawerOpener.focus();
    A._drawerOpener = null;
  };

  /* ---------------- SHELL ---------------- */
  A.buildShell = function () {
    var nav = A.NAV.map(function (g) {
      return '<div class="nav-group"><div class="label">' + g.group + '</div>' + g.items.map(function (it) {
        return '<button type="button" data-screen="' + it[0] + '" data-tour="nav-' + it[0] + '" title="' + it[1] + '">' + A.ICON[it[0]] + '<span class="t">' + it[1] + '</span>' + (it[0] === 'fix' ? '<span class="count" id="nav-fix-count"></span>' : '') + '</button>';
      }).join('') + '</div>';
    }).join('');
    document.getElementById('app').innerHTML =
      '<a class="skip" href="#view">Skip to content</a>' +
      '<aside class="sidebar" id="sidebar" aria-label="Main navigation">' +
      '<div class="brand"><div class="logo-chip"><img data-brand-logo alt="Shell Key logo"></div><div><div class="brand-name">DCMA Schedule Health Reviewer</div><div class="brand-sub">by <span id="brand-company">Shell Key</span></div></div></div>' +
      '<nav class="nav">' + nav + '</nav>' +
      '<div class="side-foot"><button class="btn sm ghost collapse-btn" id="collapse" type="button" aria-label="Collapse navigation">' + A.ICON.collapse + '<span class="t">Collapse menu</span></button>' +
      '<div class="edition"><span class="t">' + RULES().label + ' · v' + SK.CONFIG.version + '</span></div></div>' +
      '</aside><div class="scrim" id="scrim"></div>' +
      '<div class="content" style="min-width:0">' +
      '<header class="topbar"><button class="btn icon-btn ghost menu-btn" id="menu" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">' + A.ICON.menu + '</button>' +
      '<div class="title"><h1 id="page-title">How It Works</h1><div class="ctx" id="ctx"></div></div>' +
      '<div class="top-actions"><button class="btn" id="learn" type="button" data-tour="learn">' + A.ICON.learn + '<span>Learn this screen</span></button>' +
      '<button class="btn primary hide-sm" type="button" data-go="load" aria-label="Load schedule">' + A.ICON.load + '<span>Load schedule</span></button></div></header>' +
      '<main id="view" tabindex="-1"></main></div>' +
      '<div class="drawer-scrim" id="drawer-scrim"></div><aside class="drawer" id="drawer" aria-label="Activity details"></aside>' +
      '<div class="toasts" id="toasts" aria-live="polite"></div>';
    var app = document.getElementById('app'); app.className = 'app';
    document.querySelectorAll('.nav button[data-screen]').forEach(function (b) { b.onclick = function () { A.go(b.dataset.screen); }; });
    document.getElementById('menu').onclick = function () { var o = document.body.classList.toggle('nav-open'); this.setAttribute('aria-expanded', String(o)); if (o) document.querySelector('.nav button').focus(); };
    document.getElementById('scrim').onclick = function () { document.body.classList.remove('nav-open'); };
    document.getElementById('collapse').onclick = function () { S.look.nav = S.look.nav === 'collapsed' ? 'expanded' : 'collapsed'; A.applyLook(); this.setAttribute('aria-label', S.look.nav === 'collapsed' ? 'Expand navigation' : 'Collapse navigation'); };
    document.getElementById('learn').onclick = function () { SK.tutorials.start(S.screen); };
    document.getElementById('drawer-scrim').onclick = A.closeDrawer;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { if (document.getElementById('drawer').classList.contains('open')) A.closeDrawer(); else document.body.classList.remove('nav-open'); }
    });
    /* any element with data-go navigates (banners, cards, buttons) */
    document.addEventListener('click', function (e) {
      var g = e.target.closest('[data-go]'); if (!g) return;
      e.preventDefault(); A.go(g.getAttribute('data-go'), g.dataset.opts ? JSON.parse(g.dataset.opts) : {});
    });
    A.applyLook();
  };

  /* ---------------- SAVED SETTINGS (subscriber edition only) ----------------
     Saves appearance, thresholds, options and "Prepared by" in this browser.
     The schedule itself is never stored.  Demo edition never saves.        */
  var KEY = 'sk-dcma-settings-v1';
  A.saveSettings = function () {
    if (!SK.can('persist')) return;
    try { localStorage.setItem(KEY, JSON.stringify({ look: S.look, th: S.th, opt: S.opt, preparedBy: S.report.preparedBy })); } catch (e) { }
  };
  A.loadSettings = function () {
    if (!SK.can('persist')) return;
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!d) return;
      Object.assign(S.look, d.look || {}); Object.assign(S.th, d.th || {}); Object.assign(S.opt, d.opt || {});
      if (d.preparedBy) S.report.preparedBy = d.preparedBy;
    } catch (e) { }
  };

  A.start = function () {
    A.loadSettings();
    A.buildShell();
    try { A.loadSample(); } catch (e) { document.getElementById('view').innerHTML = '<div class="banner warn"><p>The sample schedule could not be read: ' + U.esc(e.message) + '</p></div>'; return; }
    var h = (location.hash || '').slice(1);
    A.go(A.TITLES[h] ? h : 'how', { focus: false });
  };
})(window);

</script>
<script>
/* ===== screens.js ===== */
/* =====================================================================
   SCREENS — one render function per navigation item.
   Each screen reads SK.state (model, R = DCMA result, CV = curves) and
   never changes the schedule data.  Tour targets use data-tour="..."
   ===================================================================== */
(function (root) {
  var SK = root.SK, U = SK.util, A = SK.app, CH = SK.charts;
  var S = SK.state;
  var X = SK.screens = {};

  /* ---------------- small shared helpers ---------------- */
  function badge(c) {
    if (c.info) return c.assessed ? '<span class="badge b-info">i Info</span>' : '<span class="badge b-na">— N/A</span>';
    if (c.pass === true) return '<span class="badge b-pass">✓ Pass</span>';
    if (c.pass === false) return '<span class="badge b-fail">✕ Fail</span>';
    return '<span class="badge b-na">— N/A</span>';
  }
  var PRI = { 1: 'P1 · Fix now', 2: 'P2 · This update', 3: 'P3 · Review' };
  function pri(p) { return '<span class="badge p' + p + '">' + PRI[p] + '</span>'; }
  X.badge = badge; X.pri = pri; X.PRI = PRI;
  function head(title, text, actions) {
    return '<div class="page-head"><div><h2>' + title + '</h2>' + (text ? '<p>' + text + '</p>' : '') + '</div>' + (actions ? '<div class="row">' + actions + '</div>' : '') + '</div>';
  }
  function bindRows(root) {
    root.querySelectorAll('[data-key]').forEach(function (el) {
      el.addEventListener('click', function (e) { if (e.target.closest('button,a') && e.target.closest('button,a') !== el) return; A._drawerOpener = el; A.openActivity(el.dataset.key); });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); A._drawerOpener = el; A.openActivity(el.dataset.key); } });
    });
  }
  X.bindRows = bindRows;
  function weeksSel(sel, val, opts) { return opts.map(function (o) { return '<option value="' + U.esc(o[0]) + '"' + (String(val) === String(o[0]) ? ' selected' : '') + '>' + U.esc(o[1]) + '</option>'; }).join(''); }
  X.options = weeksSel;

  /* =================================================================
     HOW IT WORKS  (opens first)
     ================================================================= */
  X.how = function (el) {
    var pr = SK.CONFIG.pricing;
    el.innerHTML = A.banner() +
      '<div class="hero" data-tour="how-hero">' +
      '<section class="card" aria-labelledby="how-h"><h2 id="how-h">Grade your schedule the way a DCMA reviewer would — in plain English.</h2>' +
      '<p>Load a Primavera P6 or Microsoft Project schedule. In a few seconds you get a letter grade, all 14 DCMA checks, and a fix list sorted by what to fix first — with the Activity IDs ready to paste. Then print a client-ready report.</p>' +
      '<p class="muted">' + (SK.can('reviewOwnFile') ? 'The schedule stays on your device: it is read in this browser window and never uploaded.' : 'This demo uses a fictional sample schedule. Subscribers review their own schedules, read on their own computer and never uploaded.') + '</p>' +
      '<div class="row" style="margin-top:12px"><button class="btn primary" type="button" data-go="dash" data-tour="how-sample">See the sample review</button>' +
      '<button class="btn" type="button" data-go="' + (SK.can('reviewOwnFile') ? 'load' : 'pricing') + '">' + (SK.can('reviewOwnFile') ? 'Load my schedule' : 'Use it on my schedule') + '</button>' +
      '<button class="btn" type="button" id="how-tour" data-tour="how-tour">' + A.ICON.learn + ' Take the 2-minute tour</button></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn sm" id="how-read" type="button" data-tour="how-read">🔊 Read aloud</button><span class="small muted">Prefer listening? This page can be read to you.</span></div>' +
      '</section>' +
      '<aside class="card" aria-labelledby="how-price"><h2 id="how-price">One plan</h2><div class="price">$' + pr.monthly + '<small> / month</small></div><p class="muted" style="margin:0">' + U.esc(pr.contract) + '</p>' +
      '<ul class="ticks"><li>Unlimited schedule reviews</li><li>P6 XER, P6 XML and MS Project XML</li><li>Fix list, dashboard and reports for your own files</li><li>Guided tutorials with read-aloud on every screen</li></ul>' +
      '<button class="btn" type="button" data-go="pricing" style="width:100%">See plan details</button></aside></div>' +
      '<section class="card" style="margin-top:16px" aria-labelledby="how-steps" data-tour="how-steps"><h2 id="how-steps" style="margin-bottom:14px">How it works — four steps</h2><div class="grid g2">' +
      step(1, 'Load your schedule', 'Choose <b>Load Schedule</b> and pick a P6 XER, P6 XML, or MS Project XML file. Native .mpp files need one extra step: in MS Project choose <i>File → Save As → XML</i>.') +
      step(2, 'Read your grade', 'The <b>Dashboard</b> shows a letter grade (A–F) from the DCMA checks passed, the forecast finish against the required date, progress against plan, and manpower and cost when the schedule is loaded with them.') +
      step(3, 'Fix by priority', 'The <b>Fix List</b> puts every problem in order: <b>P1 Fix now</b>, <b>P2 This update</b>, <b>P3 Review</b>. Each row names the Activity ID, what to change and why. <b>Copy for Excel / P6</b> puts one value in each cell.') +
      step(4, 'Share a report', '<b>Reports</b> builds white-page, branded reports — Executive Summary, DCMA Detail, Fix List, Critical Path, Cost & Manpower — ready to print or save as PDF.') +
      '</div></section>' +
      '<section class="card" style="margin-top:16px" aria-labelledby="how-what"><h2 id="how-what" style="margin-bottom:12px">What the review checks</h2>' +
      '<div class="tiles">' + Object.keys(SK.dcma.INFO).map(function (n) { var i = SK.dcma.INFO[n]; return '<div class="tile na" style="cursor:default"><span class="t-n">Check ' + n + '</span><span class="t-name">' + i.name + '</span><span class="small muted">' + U.esc(i.means.split('.')[0]) + '.</span></div>'; }).join('') + '</div>' +
      '<p class="small muted" style="margin-top:10px">Thresholds are the common DCMA 14-Point values and can be changed in Settings. Passing them is a quality signal, not a certificate of DCMA compliance.</p></section>';
    function step(n, t, b) { return '<div class="how-step"><div class="n" aria-hidden="true">' + n + '</div><div><h3>' + n + '. ' + t + '</h3><p style="margin:4px 0 0">' + b + '</p></div></div>'; }
    SK.voice.toggleButton(el.querySelector('#how-read'), function () { return SK.tutorials.STORY; });
    el.querySelector('#how-tour').onclick = function () { SK.tutorials.startOnboarding(); };
  };

  /* =================================================================
     LOAD SCHEDULE
     ================================================================= */
  X.load = function (el, opts) {
    var m = S.model, pj = m.project, st = m.stats;
    var types = st.byType, stat = st.byStatus, own = SK.can('reviewOwnFile');
    var err = opts.error ? '<div class="banner warn" role="alert"><span class="b-ico">!</span><p><b>That file could not be reviewed.</b> ' + U.esc(opts.error) + '</p></div>' : '';
    var okMsg = opts.loadedMs != null ? '<div class="banner info" role="status"><span class="b-ico">✓</span><p><b>' + U.esc(m.fileName) + ' was read and checked in ' + opts.loadedMs + ' ms.</b> Open the <button class="btn sm ghost" data-go="dash" type="button">Dashboard</button> to see the grade.</p></div>' : '';
    el.innerHTML = A.banner() + err + okMsg +
      head('Load a schedule', own ? 'The file is read on this device only — nothing is uploaded or saved.' : 'The demo shows the built-in sample schedule only. Your own schedules open in the subscriber edition.') +
      '<div class="grid g2">' +
      '<section class="card" aria-labelledby="ld-pick"><h2 id="ld-pick" style="margin-bottom:10px">' + (own ? 'Choose a file' : 'Review your own schedule') + '</h2>' +
      (own ? '<div class="drop" id="drop" data-tour="drop"><h3>Drag a schedule file here</h3><p class="muted">or</p>' +
      '<label class="btn primary" for="file-in" data-tour="choose" tabindex="0" id="choose-lbl">' + A.ICON.load + ' Choose a file</label>' +
      '<input type="file" id="file-in" accept=".xer,.xml,.mpp" class="sr-only">' +
      '<p class="small muted" style="margin-top:10px">Supported: Primavera P6 <b>.xer</b>, Primavera P6 <b>.xml</b>, Microsoft Project <b>.xml</b>. Up to 60 MB.</p></div>'
      : '<div class="drop" data-tour="drop"><h3>🔒 Subscriber edition</h3><p>This demo cannot open your files. Subscribe for <b>$' + SK.CONFIG.pricing.monthly + '/month</b> (cancel anytime) and the subscriber edition is sent to you. It reads Primavera P6 <b>.xer</b> and <b>.xml</b> and Microsoft Project <b>.xml</b>, right on your own computer.</p>' +
        '<button class="btn primary" type="button" data-go="pricing" data-tour="choose">See the plan and subscribe</button></div>') +
      '<div class="row" style="margin-top:12px">' + (S.isSample ? '' : '<button class="btn" id="back-sample" type="button">Back to the sample schedule</button>') +
      '<button class="btn" id="dl-sample" type="button" data-tour="dl-sample">Download the sample .xer</button></div>' +
      '<details style="margin-top:14px"><summary><b>How to export from P6 or MS Project</b></summary>' +
      '<ol style="margin:8px 0 0;padding-left:20px"><li><b>P6 XER:</b> File → Export → Primavera PM (XER) → choose the project → Finish. Include the baseline project in the same export if you want true baseline dates.</li>' +
      '<li><b>P6 XML:</b> File → Export → Primavera PM (XML).</li><li><b>MS Project:</b> set the Status Date (Project → Status Date), then File → Save As → XML Format (*.xml). Save a baseline first so BEI and Missed Tasks can be graded.</li></ol></details>' +
      '</section>' +
      '<section class="card" aria-labelledby="ld-cur" data-tour="current"><h2 id="ld-cur" style="margin-bottom:10px">Schedule being reviewed</h2>' +
      '<dl class="kv"><dt>Project</dt><dd class="sel">' + U.esc(pj.name || pj.code) + (pj.code && pj.name !== pj.code ? ' <span class="muted mono">(' + U.esc(pj.code) + ')</span>' : '') + '</dd>' +
      '<dt>File</dt><dd class="sel">' + U.esc(m.fileName) + (S.isSample ? ' <span class="badge b-info">Fictional sample</span>' : '') + '</dd>' +
      '<dt>Format</dt><dd>' + U.esc(m.format) + '</dd>' +
      '<dt>Data date</dt><dd>' + U.fmtLong(pj.dataDay) + '</dd>' +
      '<dt>Required finish</dt><dd>' + (S.R.targetDay != null ? U.fmtLong(S.R.targetDay) + ' <span class="muted">(' + U.esc(S.R.targetSrc) + ')</span>' : '—') + '</dd>' +
      '<dt>Activities</dt><dd>' + st.activities + ' — ' + (types.task || 0) + ' tasks, ' + ((types.start || 0) + (types.finish || 0)) + ' milestones' + (types.loe ? ', ' + types.loe + ' level of effort' : '') + (types.wbs ? ', ' + types.wbs + ' summary' : '') + '</dd>' +
      '<dt>Status</dt><dd>' + (stat.C || 0) + ' complete · ' + (stat.IP || 0) + ' in progress · ' + (stat.NS || 0) + ' not started</dd>' +
      '<dt>Relationships</dt><dd>' + st.rels + '</dd>' +
      '<dt>Resources</dt><dd>' + (st.resourceLoaded ? 'Labor hours loaded' : 'No labor hours') + ' · ' + (st.costLoaded ? 'cost loaded' : 'no cost') + '</dd>' +
      '<dt>Baseline</dt><dd>' + U.esc(pj.baselineSource) + '</dd>' +
      '<dt>Contractor field</dt><dd>' + (m.contractorField ? U.esc(m.contractorField) : '<span class="muted">None found (looks for a code or field named Contractor, Company or User Text 1)</span>') + '</dd></dl>' +
      (m.projects.length > 1 ? '<div class="field" style="margin-bottom:10px"><label for="pick-proj">Project in this file</label><select class="input" id="pick-proj">' + weeksSel(null, pj.id, m.projects.map(function (p) { return [p.id, p.name + ' (' + p.count + ' activities)']; })) + '</select></div>' : '') +
      (m.baselineOptions.length ? '<div class="field" style="margin-bottom:10px"><label for="pick-bl">Baseline</label><select class="input" id="pick-bl"><option value="">P6 Planned dates</option>' + weeksSel(null, pj.baselineProjectId || '', m.baselineOptions.map(function (p) { return [p.id, p.name]; })) + '</select></div>' : '') +
      (m.warnings.length ? '<h3 style="margin:10px 0 6px">Warnings</h3><ul style="margin:0;padding-left:20px">' + m.warnings.slice(0, 12).map(function (w) { return '<li class="sel">' + U.esc(w) + '</li>'; }).join('') + '</ul>' : '') +
      '<h3 style="margin:10px 0 6px">How this file was read</h3><ul class="small" style="margin:0;padding-left:20px;color:var(--text-2)">' + m.notes.concat(['Activities without a type such as Level of Effort and WBS summary rows are left out of the DCMA checks.', 'The critical path test uses a Monday–Friday check engine; float graded in checks 6 and 7 is the float stored in your file.']).map(function (n) { return '<li>' + U.esc(n) + '</li>'; }).join('') + '</ul>' +
      '</section></div>';

    var input = el.querySelector('#file-in'), drop = el.querySelector('#drop');
    if (input) el.querySelector('#choose-lbl').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
    function handle(file) {
      drop.innerHTML = '<h3>Reading ' + U.esc(file.name) + '…</h3><p class="muted">Checking all 14 DCMA points.</p>';
      A.readFile(file, function (e, ms) {
        if (e) { if (S.lastName && !S.model) A.loadSample(); A.go('load', { error: e.message, focus: false }); A.toast(U.esc(e.message), 'bad'); return; }
        A.go('load', { loadedMs: ms, focus: false });
        A.toast('<b>' + U.esc(file.name) + '</b> reviewed: grade ' + S.R.grade + ' (' + S.R.passed + ' of ' + S.R.graded + ' checks passed).', 'good');
      });
    }
    if (input) {
      input.onchange = function () { if (input.files[0]) handle(input.files[0]); };
      ['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
      drop.addEventListener('drop', function (e) { var f = e.dataTransfer.files[0]; if (f) handle(f); });
    }
    var back = el.querySelector('#back-sample'); if (back) back.onclick = function () { A.loadSample(); A.go('load', { focus: false }); A.toast('Back to the sample schedule.', 'good'); };
    el.querySelector('#dl-sample').onclick = function () { U.download(SK.SAMPLE.text, SK.SAMPLE.name, 'text/plain'); A.toast('Downloaded ' + SK.SAMPLE.name + ' — a fictional sample you can open in P6 or load back here.', 'good'); };
    var pp = el.querySelector('#pick-proj'); if (pp) pp.onchange = function () { reload({ projectId: pp.value }); };
    var pb = el.querySelector('#pick-bl'); if (pb) pb.onchange = function () { reload(Object.assign({}, S.loadOpts, { baselineProjectId: pb.value })); };
    function reload(o) { try { A.loadText(S.lastName, S.lastText, S.isSample, o); A.go('load', { focus: false }); } catch (e) { A.toast(U.esc(e.message), 'bad'); } }
  };

  /* =================================================================
     DASHBOARD
     ================================================================= */
  X.dash = function (el) {
    var R = S.R, CV = S.CV, m = S.model, pj = m.project;
    var fx = R.fixes, p1 = fx.filter(function (f) { return f.pri === 1; }).length, p2 = fx.filter(function (f) { return f.pri === 2; }).length, p3 = fx.length - p1 - p2;
    var late = R.daysLate, lateTxt = late == null ? 'No required date in the file' : late > 0 ? '<span class="neg">▲ ' + late + ' working days late</span> vs ' + U.fmt(R.targetDay) : late < 0 ? '<span class="pos">▼ ' + (-late) + ' working days early</span> vs ' + U.fmt(R.targetDay) : 'On the required date ' + U.fmt(R.targetDay);
    var behind = CV.plannedNow != null ? (CV.earnedNow - CV.plannedNow) * 100 : null;
    var c = function (n) { return R.checks[n - 1]; };
    var cost = CV.cost;
    /* ---- layout: 8 even KPI cards · 14 even check tiles · two even chart rows ---- */
    el.innerHTML = A.banner() + '<div class="stack">' +
      '<div class="dash-kpis" data-tour="kpis">' +
      '<button type="button" class="card kpi kpi-grade" data-go="dcma" data-tour="grade" aria-label="Health grade ' + R.grade + ', ' + R.passed + ' of ' + R.graded + ' checks passed. Open the DCMA checks.">' + CH.ring(R.checks, R.grade, 76) +
      '<span class="kpi-txt"><span class="k-label">Health grade</span><span class="k-value">' + R.passed + ' of ' + R.graded + '</span><span class="k-sub">DCMA checks passed · grade ' + R.grade + '</span></span></button>' +
      kpi('Forecast finish', U.fmt(R.forecastFinish), lateTxt, 'cp') +
      kpi('Progress', U.pct(CV.earnedNow), CV.plannedNow != null ? 'Planned ' + U.pct(CV.plannedNow) + ' · ' + (behind < 0 ? '<span class="neg">' + Math.abs(behind).toFixed(1) + ' pts behind</span>' : '<span class="pos">' + behind.toFixed(1) + ' pts ahead</span>') : 'No baseline in file', null) +
      kpi('Fix list', String(fx.length), '<span class="badge p1">' + p1 + ' P1</span> <span class="badge p2">' + p2 + ' P2</span> <span class="badge p3">' + p3 + ' P3</span>', 'fix') +
      kpi('Negative float', c(7).assessed ? String(c(7).items.length) : '—', c(7).assessed ? 'of ' + R.population.incomplete + ' incomplete activities' : 'No float in file', 'cp') +
      kpi('CPLI', c(13).metric, 'Target ' + c(13).target + ' · ' + badge(c(13)), 'dcma') +
      kpi('BEI', c(14).metric, 'Target ' + c(14).target + ' · ' + badge(c(14)), 'dcma') +
      (cost ? kpi('Forecast cost (EAC)', U.money(cost.EAC), (cost.VAC < 0 ? '<span class="neg">' + U.money(-cost.VAC) + ' over</span>' : '<span class="pos">' + U.money(cost.VAC) + ' under</span>') + ' budget of ' + U.money(cost.BAC), null)
        : kpi('Activities checked', String(R.population.total), R.population.incomplete + ' incomplete · ' + m.stats.rels + ' relationships', 'acts')) +
      '</div>' +
      '<section class="card" data-tour="tiles" aria-labelledby="t-h"><header><div><h2 id="t-h">DCMA 14-Point at a glance</h2><p class="small muted">Select a check to see the activities behind it.</p></div><button class="btn sm" type="button" data-go="dcma">See all checks</button></header><div class="tiles t7">' +
      R.checks.map(function (k) { return '<button type="button" class="tile ' + (k.pass === true ? 'pass' : k.pass === false ? 'fail' : 'na') + '" data-go="dcma" data-opts=\'{"open":' + k.n + '}\'><span class="t-n">Check ' + k.n + '</span><span class="t-name">' + k.name + '</span><span class="t-val"><b>' + U.esc(k.metric) + '</b> ' + badge(k) + '</span></button>'; }).join('') + '</div></section>' +
      '<div class="dash-2">' +
      '<section class="card" data-tour="scurve" aria-labelledby="s-h"><header><div><h2 id="s-h">Progress S-curve</h2><p class="small muted">Weighted by ' + U.esc(CV.basisLabel) + '</p></div><button class="btn sm" type="button" id="s-table" aria-pressed="false">Show as table</button></header>' +
      CH.legend([{ name: 'Baseline plan', color: 'var(--c-baseline)', dash: '7 5' }, { name: 'Actual (est. from actual dates)', color: 'var(--c-actual)' }, { name: 'Forecast', color: 'var(--c-forecast)', dash: '2 5' }]) +
      '<div id="s-chart"></div><div id="s-tbl" hidden></div><p class="chart-note">Actual line is spread over actual dates and stops at the data date (' + U.fmt(pj.dataDay) + ').</p></section>' +
      '<section class="card" data-tour="manpower" aria-labelledby="m-h"><header><div><h2 id="m-h">Manpower</h2><p class="small muted">' + (CV.manpower ? 'Monthly labor by craft' : 'Not available') + '</p></div>' +
      (CV.manpower ? '<div class="seg" role="group" aria-label="Manpower units"><button type="button" data-mp="hours" aria-pressed="' + (S.mpMode === 'hours') + '">Hours</button><button type="button" data-mp="head" aria-pressed="' + (S.mpMode === 'head') + '">Headcount</button></div>' : '') + '</header>' +
      (CV.manpower ? '<div id="mp-legend"></div><div id="mp-chart"></div><p class="chart-note">Lighter bars = forecast. Headcount = hours ÷ ' + S.opt.hoursPerPersonWeek + ' h per person-week. Budget ' + U.num(CV.manpower.budH) + ' h · at completion ' + U.num(CV.manpower.eacH) + ' h.</p>' : '<div class="empty grow">This schedule has no labor hours loaded, so manpower cannot be shown. Assign labor resources with budgeted hours in P6 or MS Project to see it here.</div>') + '</section>' +
      '</div><div class="dash-2">' +
      '<section class="card" data-tour="cost" aria-labelledby="c-h"><header><div><h2 id="c-h">Cost</h2><p class="small muted">' + (cost ? 'Cumulative budget, actual and forecast' : 'Not available') + '</p></div></header>' +
      (cost ? CH.legend([{ name: 'Budget plan', color: 'var(--c-baseline)', dash: '7 5' }, { name: 'Actual cost', color: 'var(--c-actual)' }, { name: 'Forecast cost', color: 'var(--c-forecast)', dash: '2 5' }]) + '<div id="c-chart"></div>' +
        '<div class="mini-stats">' + mini('Budget', U.money(cost.BAC)) + mini('Actual', U.money(cost.AC)) + mini('Earned', U.money(cost.EV)) +
        mini('CPI', cost.CPI == null ? 'n/a' : cost.CPI.toFixed(2)) + mini('SPI', cost.SPI == null ? 'n/a' : cost.SPI.toFixed(2)) + mini('EAC', U.money(cost.EAC)) + '</div>' +
        '<p class="chart-note">EAC = actual + remaining cost. CPI = earned ÷ actual. SPI = earned ÷ planned.</p>'
        : '<div class="empty grow">No cost is loaded in this schedule. Add resource rates or expenses in P6 to see cost tracking here.</div>') + '</section>' +
      '<section class="card" data-tour="topfix" aria-labelledby="f-h"><header><div><h2 id="f-h">Fix these first</h2><p class="small muted">Top of the prioritized fix list</p></div><button class="btn sm" type="button" data-go="fix">Open Fix List</button></header>' +
      (fx.length ? '<div class="fx-rows">' + fx.slice(0, 6).map(function (f) {
        return '<div class="fx-row"' + (f.key ? ' data-key="' + f.key + '" tabindex="0" role="button" aria-label="Open ' + U.esc(f.id) + '"' : '') + '><span class="badge p' + f.pri + '">P' + f.pri + '</span><span class="mono small">' + U.esc(f.id) + '</span><span class="fx-name"><b>' + U.esc(f.name) + '</b><span class="small muted">' + U.esc(f.check) + '</span></span></div>';
      }).join('') + '</div><p class="chart-note">' + fx.length + ' items in all · select a row for what to do and why.</p>' : '<div class="empty grow">No problems found.</div>') + '</section>' +
      '</div></div>';

    function kpi(label, value, sub, go) {
      var tag = go ? 'button type="button" data-go="' + go + '"' : 'div';
      return '<' + tag + ' class="card kpi"><span class="k-label">' + label + '</span><span class="k-value">' + value + '</span><span class="k-sub">' + sub + '</span></' + tag.split(' ')[0] + '>';
    }
    function mini(l, v) { return '<div class="mini-stat"><span class="k-label">' + l + '</span><b>' + v + '</b></div>'; }

    var pctFmt = function (v) { return Math.round(v * 100) + '%'; };
    var pctTip = function (v) { return (v * 100).toFixed(1) + '%'; };
    CH.line(el.querySelector('#s-chart'), {
      height: 250, title: 'Progress S-curve: baseline, actual and forecast percent complete', yMax: 1, yFmt: function (v, tip) { return tip ? pctTip(v) : pctFmt(v); }, ddDay: pj.dataDay,
      series: [{ name: 'Baseline', color: 'var(--c-baseline)', dash: '7 5', pts: CV.baseline }, { name: 'Actual (est.)', color: 'var(--c-actual)', pts: CV.actual, endDot: true }, { name: 'Forecast', color: 'var(--c-forecast)', dash: '2 5', pts: CV.forecast }]
    });
    el.querySelector('#s-table').onclick = function () {
      var t = el.querySelector('#s-tbl'), ch = el.querySelector('#s-chart'), show = t.hidden;
      t.hidden = !show; ch.hidden = show; this.setAttribute('aria-pressed', String(show)); this.textContent = show ? 'Show as chart' : 'Show as table';
      if (show) t.innerHTML = X.curveTable();
    };
    if (CV.manpower) X.drawManpower(el);
    el.querySelectorAll('[data-mp]').forEach(function (b) { b.onclick = function () { S.mpMode = b.dataset.mp; el.querySelectorAll('[data-mp]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); X.drawManpower(el); }; });
    if (cost) CH.line(el.querySelector('#c-chart'), {
      height: 250, title: 'Cumulative cost: budget, actual and forecast', yFmt: function (v) { return U.money(v); }, ddDay: pj.dataDay, ml: 62,
      series: [{ name: 'Budget', color: 'var(--c-baseline)', dash: '7 5', pts: cost.baseline }, { name: 'Actual', color: 'var(--c-actual)', pts: cost.actual, endDot: true }, { name: 'Forecast', color: 'var(--c-forecast)', dash: '2 5', pts: cost.forecast }]
    });
    bindRows(el);
  };

  /* month-end table for the S-curve (accessible alternative) */
  X.curveTable = function () {
    var CV = S.CV, rows = {}, order = [];
    function put(list, key) { list.forEach(function (p) { if (p.v == null) return; var mk = U.monthKey(p.day); if (!rows[mk]) { rows[mk] = {}; order.push(mk); } rows[mk][key] = p.v; }); }
    put(CV.baseline, 'b'); put(CV.actual, 'a'); put(CV.forecast, 'f');
    order.sort(function (a, b) { return a - b; });
    return '<div class="table-wrap" style="max-height:320px"><table class="data"><caption class="sr-only">Percent complete at the end of each month</caption><thead><tr><th>Month</th><th class="num">Baseline</th><th class="num">Actual (est.)</th><th class="num">Forecast</th></tr></thead><tbody>' +
      order.map(function (k) { var r = rows[k]; return '<tr><td>' + U.monthLabel(k) + '</td><td class="num">' + (r.b != null ? U.pct(r.b) : '—') + '</td><td class="num">' + (r.a != null ? U.pct(r.a) : '—') + '</td><td class="num">' + (r.f != null ? U.pct(r.f) : '—') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  };

  X.CAT = ['var(--cat1)', 'var(--cat2)', 'var(--cat3)', 'var(--cat4)', 'var(--cat5)', 'var(--cat6)'];
  X.drawManpower = function (el) {
    var MP = S.CV.manpower, head = S.mpMode === 'head', hpw = S.opt.hoursPerPersonWeek;
    var colors = MP.series.map(function (n, i) { return n === 'Other' ? 'var(--cat-other)' : X.CAT[i]; });
    var rows = MP.rows.map(function (r) {
      var f = head ? 1 / (hpw * r.workdays / 5) : 1, parts = {};
      Object.keys(r.byCraft).forEach(function (k) { parts[k] = r.byCraft[k] * f; });
      return { label: r.label, parts: parts, plan: r.plan * f, part: r.actualPart };
    });
    el.querySelector('#mp-legend').innerHTML = CH.legend(MP.series.map(function (n, i) { return { name: n, color: colors[i], box: true }; }).concat([{ name: 'Baseline plan (total)', color: 'var(--c-baseline)', dash: '7 5' }]));
    CH.bars(el.querySelector('#mp-chart'), {
      height: 250, title: 'Monthly manpower by craft, ' + (head ? 'average headcount' : 'labor hours'), rows: rows, series: MP.series, colors: colors, planName: 'Baseline plan',
      yFmt: function (v, tip) { return head ? (tip ? v.toFixed(1) + ' people' : Math.round(v)) : (tip ? U.num(v) + ' h' : (v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v))); }
    });
  };
})(window);

</script>
<script>
/* ===== screens2.js ===== */
/* =====================================================================
   SCREENS (part 2) — DCMA 14-Point, Fix List, Critical Path, Activities
   ===================================================================== */
(function (root) {
  var SK = root.SK, U = SK.util, A = SK.app, X = SK.screens;
  var S = SK.state;

  function head(title, text, actions) {
    return '<div class="page-head"><div><h2>' + title + '</h2>' + (text ? '<p>' + text + '</p>' : '') + '</div>' + (actions ? '<div class="row">' + actions + '</div>' : '') + '</div>';
  }

  /* =================================================================
     DCMA 14-POINT
     ================================================================= */
  X.dcma = function (el, opts) {
    var R = S.R, m = S.model;
    var loops = R.loops.length ? '<div class="banner warn" role="alert"><span class="b-ico">!</span><p><b>Circular logic found (' + R.loops.length + ' loop' + (R.loops.length > 1 ? 's' : '') + ').</b> ' + R.loops.map(function (l) { return l.map(function (k) { return U.esc(m.byKey[k].id); }).join(' → '); }).join('; ') + '. These are listed first in the Fix List.</p></div>' : '';
    el.innerHTML = A.banner() + loops +
      head('DCMA 14-Point Assessment', 'Grade <b>' + R.grade + '</b> — ' + R.passed + ' of ' + R.graded + ' graded checks passed. Check 10 (Resources) is informational. Counts use the ' + R.population.incomplete + ' incomplete activities (Level of Effort and WBS summary rows are left out) and the ' + R.population.rels + ' relationships that touch incomplete work.',
        '<button class="btn" type="button" id="dc-expand" data-tour="dc-expand">Expand all</button><button class="btn" type="button" data-go="settings" data-opts=\'{"section":"th"}\'>Change thresholds</button>') +
      '<div id="checks" data-tour="checks">' + R.checks.map(function (c) {
        return '<section class="check" id="chk-' + c.n + '"><button type="button" class="head" aria-expanded="false" aria-controls="chk-body-' + c.n + '">' +
          '<span class="num-dot" aria-hidden="true">' + c.n + '</span>' +
          '<span><span class="c-name">' + c.n + '. ' + c.name + '</span><br><span class="c-meta">' + U.esc(c.means) + '</span></span>' +
          '<span class="c-right"><span class="c-metric">' + U.esc(c.metric) + '</span><span class="small muted">Target ' + U.esc(c.target) + '</span>' + X.badge(c) + '</span></button>' +
          '<div class="body" id="chk-body-' + c.n + '"></div></section>';

     ================================================================= */
  X.help = function (el) {
    var T = SK.tutorials.TASKS;
    el.innerHTML = head('Help Center', 'Step-by-step help for common jobs. <b>Show me</b> opens the screen and walks you through it; <b>Read aloud</b> reads the steps to you.') +
      '<div class="grid g2 even" data-tour="help-tasks">' + T.map(function (t, i) {
        return '<section class="card" aria-labelledby="ht' + i + '"><h2 id="ht' + i + '" style="margin-bottom:8px">' + t.title + '</h2><ol style="margin:0 0 12px;padding-left:22px">' + t.steps.map(function (s) { return '<li style="margin-bottom:4px">' + s + '</li>'; }).join('') + '</ol>' +
          '<div class="row card-foot"><button class="btn sm primary" type="button" data-show="' + i + '">Show me</button><button class="btn sm" type="button" data-read="' + i + '">🔊 Read aloud</button></div></section>';
      }).join('') + '</div>' +
      '<section class="card" style="margin-top:16px" aria-labelledby="gl-h" data-tour="help-glossary"><h2 id="gl-h" style="margin-bottom:10px">The 14 checks in plain English</h2><div class="grid g2 even">' +
      Object.keys(SK.dcma.INFO).map(function (n) { var i = SK.dcma.INFO[n]; return '<div class="card nest"><h3>' + n + '. ' + i.name + '</h3><p class="small" style="margin:6px 0">' + U.esc(i.means) + '</p><p class="small muted" style="margin:0 0 8px">' + U.esc(i.why) + '</p><div class="card-foot"><button class="btn sm" type="button" data-gl="' + n + '">🔊 Read aloud</button></div></div>'; }).join('') +
      '</div></section>' +
      '<section class="card" style="margin-top:16px" aria-labelledby="lim-h"><h2 id="lim-h" style="margin-bottom:8px">How the review works and its limits</h2><ul style="margin:0;padding-left:20px">' +
      '<li>Grade = graded checks passed ÷ checks assessed. A ≥ 90%, B ≥ 80%, C ≥ 70%, D ≥ 60%, F below 60%. Resources (check 10) is shown for information only.</li>' +
      '<li>Float for checks 6 and 7 comes from your file, converted from hours with each calendar\'s hours per day.</li>' +
      '<li>The critical path test re-runs the logic with a Monday–Friday calendar without holidays, so its dates can differ slightly from P6 or MS Project. It never changes your file.</li>' +
      '<li>An XER holds only the current status, so the actual S-curve is estimated from each activity\'s actual dates and stops at the data date.</li>' +
      '<li>If the file has no baseline project, P6 Planned dates are used as the baseline (shown on Load Schedule).</li>' +
      '<li>Large schedules: tested with 10,000 activities and about 15,000 relationships in a desktop browser (checked in under half a second); very large files take longer on phones.</li>' +
      '<li>Questions: ' + U.esc(SK.CONFIG.contactEmail) + '</li></ul></section>';
    el.querySelectorAll('[data-show]').forEach(function (b) { b.onclick = function () { var t = T[+b.dataset.show]; A.go(t.screen); setTimeout(function () { SK.tutorials.start(t.screen); }, 60); }; });
    el.querySelectorAll('[data-read]').forEach(function (b) { var t = T[+b.dataset.read]; SK.voice.toggleButton(b, function () { return t.title + '. ' + t.steps.map(function (s, i) { return 'Step ' + (i + 1) + '. ' + s.replace(/<[^>]+>/g, ''); }).join(' '); }); });
    el.querySelectorAll('[data-gl]').forEach(function (b) { var i = SK.dcma.INFO[b.dataset.gl]; SK.voice.toggleButton(b, function () { return 'Check ' + b.dataset.gl + ', ' + i.name + '. ' + i.means + ' ' + i.why + ' How to fix: ' + i.fix; }); });
  };
})(window);

</script>
<script>
/* ===== reports.js ===== */
/* =====================================================================
   REPORTS — white-page, branded, print-ready layouts
   ---------------------------------------------------------------------
   Every report uses the SAME result object as the screens (S.R, S.CV),
   so totals always match the dashboard.  Printing uses the browser's
   print dialog ("Save as PDF" makes the PDF); page size, orientation
   and "Page X of Y" come from the @page rule written in print().
   ===================================================================== */
(function (root) {
  var SK = root.SK, U = SK.util, CH = SK.charts;
  var S = SK.state;
  var RP = SK.reports = {};

  /* print colors (fixed — reports are always on white paper) */
  var PC = { base: '#6b7a8f', act: '#12884a', fc: '#1f5fd1', grid: '#e5e7eb', dd: '#b26a00', ink: '#374151', surf: '#ffffff',
    cats: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300'], other: '#8a97a8', pass: '#137a43', fail: '#b42335', na: '#cbd5e1' };

  RP.PRESETS = [
    { id: 'exec', name: 'Executive Summary', desc: 'Grade, key dates, progress, DCMA summary, S-curve and the top 8 fixes. About 2 pages.', orient: 'portrait' },
    { id: 'dcma', name: 'DCMA Detailed Assessment', desc: 'All 14 checks with what they mean, the result and every activity behind each finding.', orient: 'portrait' },
    { id: 'fix', name: 'Prioritized Fix List', desc: 'Every fix item in priority order with Activity ID, what to do and why. Best in landscape.', orient: 'landscape' },
    { id: 'cp', name: 'Critical Path', desc: 'Critical path test, driving path activities with dates and float, and negative-float work.', orient: 'landscape' },
    { id: 'cost', name: 'Cost & Manpower', desc: 'Budget, actual and forecast cost, CPI/SPI, and monthly manpower by craft.', orient: 'portrait' }
  ];

  function e(s) { return U.esc(s); }
  function pf(c) { return c.info ? '<span class="pf na">Info</span>' : c.pass === true ? '<span class="pf pass">✓ Pass</span>' : c.pass === false ? '<span class="pf fail">✕ Fail</span>' : '<span class="pf na">N/A</span>'; }
  function pri(p) { return '<span class="pri p' + p + '">P' + p + '</span>'; }

  function header(title) {
    var m = S.model, pj = m.project, R = S.R, now = new Date();
    var stamp = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return '<div class="r-head"><div><div class="water">' + (S.isSample ? 'SAMPLE DATA — FICTIONAL PROJECT' : 'SCHEDULE HEALTH REVIEW') + '</div><h1>' + e(title) + '</h1><div style="font-size:11pt;color:#1f2937">' + e(pj.name || pj.code) + '</div></div>' +
      '<div style="text-align:right"><img src="' + (S.look.logo || SK.LOGO) + '" alt="' + e(S.look.company || 'Shell Key') + ' logo"><div style="font-size:8pt;color:#4b5563;margin-top:3pt">' + e(S.look.company || SK.CONFIG.company) + ' · ' + e(SK.CONFIG.product) + '</div></div></div>' +
      '<div class="r-meta">' +
      '<div><span>Data date</span><b>' + U.fmtLong(pj.dataDay) + '</b></div>' +
      '<div><span>Required finish</span><b>' + (R.targetDay != null ? U.fmtLong(R.targetDay) : '—') + '</b></div>' +
      '<div><span>Schedule file</span><b style="word-break:break-all">' + e(m.fileName) + '</b></div>' +
      '<div><span>Generated</span><b>' + stamp + '</b></div>' +
      '<div><span>Project ID</span><b>' + e(pj.code || '—') + '</b></div>' +
      '<div><span>Baseline used</span><b>' + e(pj.baselineSource.split(' (')[0]) + '</b></div>' +
      '<div><span>Prepared by</span><b>' + e(S.report.preparedBy || '—') + '</b></div>' +
      '<div><span>Status</span><b>Draft for review</b></div></div>';
  }
  function footer() {
    var th = S.th;
    return '<div class="r-foot">Thresholds used: logic ≤' + th.logicPct + '%, leads ≤' + th.leadsMax + ', lags ≤' + th.lagsPct + '%, FS ≥' + th.fsMinPct + '%, hard constraints ≤' + th.hardCstrPct + '%, high float >' + th.highFloatDays + 'd ≤' + th.highFloatPct + '%, negative float ≤' + th.negFloatMax +
      ', high duration >' + th.highDurDays + 'd ≤' + th.highDurPct + '% (' + S.opt.durationBasis + ' duration), invalid dates ≤' + th.invalidMax + ', missed tasks ≤' + th.missedPct + '%, CPLI ≥' + th.cpliMin + ', BEI ≥' + th.beiMin +
      '. Incomplete activities exclude Level of Effort and WBS summary rows. Float is taken from the schedule file; the critical path test uses a Monday–Friday check engine. DCMA thresholds are a quality guide, not a compliance certificate. ' +
      'Generated by ' + e(SK.CONFIG.company + ' ' + SK.CONFIG.product) + ' v' + SK.CONFIG.version + '.</div>';
  }
  function kpis() {
    var R = S.R, CV = S.CV, fx = R.fixes;
    var k = function (l, v, s) { return '<div class="r-kpi"><span>' + l + '</span><b>' + v + '</b><i>' + s + '</i></div>'; };
    return '<div class="r-kpis">' +
      k('Health grade', R.grade, R.passed + ' of ' + R.graded + ' checks passed') +
      k('Forecast finish', U.fmt(R.forecastFinish), R.daysLate == null ? '—' : R.daysLate > 0 ? R.daysLate + ' working days late' : R.daysLate < 0 ? (-R.daysLate) + ' working days early' : 'On the required date') +
      k('Progress', U.pct(CV.earnedNow), CV.plannedNow != null ? 'vs ' + U.pct(CV.plannedNow) + ' planned' : 'no baseline') +
      k('Fix items', fx.length, fx.filter(function (f) { return f.pri === 1; }).length + ' P1 · ' + fx.filter(function (f) { return f.pri === 2; }).length + ' P2') + '</div>';
  }
  function dcmaTable() {
    return '<table><thead><tr><th>#</th><th>Check</th><th>Result</th><th>Target</th><th>Status</th><th>Basis</th></tr></thead><tbody>' +
      S.R.checks.map(function (c) { return '<tr><td>' + c.n + '</td><td>' + e(c.name) + '</td><td><b>' + e(c.metric) + '</b></td><td>' + e(c.target) + '</td><td>' + pf(c) + '</td><td>' + e(c.assessed ? c.basis : (c.naReason || '')) + '</td></tr>'; }).join('') + '</tbody></table>';
  }
  function fixTable(list, slim) {
    return '<table><thead><tr><th>Pri.</th><th>Activity ID</th><th>Activity name</th><th>Check</th><th>What to do</th>' + (slim ? '' : '<th>Why</th>') + '</tr></thead><tbody>' +
      list.map(function (f) { return '<tr><td>' + pri(f.pri) + '</td><td style="white-space:nowrap">' + e(f.id) + '</td><td>' + e(f.name) + '</td><td>' + e(f.check) + '</td><td>' + e(f.what) + '</td>' + (slim ? '' : '<td>' + e(f.why) + '</td>') + '</tr>'; }).join('') + '</tbody></table>';
  }
  function narrative() {
    var R = S.R, CV = S.CV, fails = R.checks.filter(function (c) { return c.pass === false; });
    var t = 'The schedule passes ' + R.passed + ' of ' + R.graded + ' graded DCMA checks, for a grade of ' + R.grade + '. ';
    if (R.forecastFinish != null && R.targetDay != null) t += 'The forecast finish is ' + U.fmtLong(R.forecastFinish) + ', ' + (R.daysLate > 0 ? R.daysLate + ' working days after' : R.daysLate < 0 ? (-R.daysLate) + ' working days before' : 'on') + ' the required finish of ' + U.fmtLong(R.targetDay) + '. ';
    if (CV.plannedNow != null) t += 'Weighted progress is ' + U.pct(CV.earnedNow) + ' against ' + U.pct(CV.plannedNow) + ' planned at the data date. ';
    if (fails.length) t += 'Checks that failed: ' + fails.map(function (c) { return c.name.toLowerCase() + ' (' + c.metric + ')'; }).join(', ') + '. ';
    var p1 = R.fixes.filter(function (f) { return f.pri === 1; }).length;
    t += p1 ? p1 + ' item' + (p1 > 1 ? 's need' : ' needs') + ' fixing before the forecast can be relied on (Priority 1).' : 'No Priority 1 items were found.';
    return t;
  }
  function scurve(width) {
    var CV = S.CV;
    var g = CH.lineSVG({ width: width, height: 230, yMax: 1, yFmt: function (v) { return Math.round(v * 100) + '%'; }, ddDay: S.model.project.dataDay, gridColor: PC.grid, inkColor: PC.ink, ddColor: PC.dd, surface: PC.surf, title: 'Progress S-curve',
      series: [{ name: 'Baseline', color: PC.base, dash: '7 5', pts: CV.baseline }, { name: 'Actual', color: PC.act, pts: CV.actual, endDot: true }, { name: 'Forecast', color: PC.fc, dash: '2 5', pts: CV.forecast }] });
    return '<div class="r-chart">' + legend([{ n: 'Baseline plan', c: PC.base, d: '7 5' }, { n: 'Actual (estimated from actual dates)', c: PC.act }, { n: 'Forecast', c: PC.fc, d: '2 5' }]) + g.svg +
      '<div class="r-note">Weighted by ' + e(CV.basisLabel) + '. The actual line is spread over each activity\'s actual dates and stops at the data date.</div></div>';
  }
  function legend(items) {
    return '<div style="display:flex;gap:12pt;flex-wrap:wrap;font-size:8pt;color:#374151;margin-bottom:2pt">' + items.map(function (i) {
      return '<span style="display:inline-flex;gap:4pt;align-items:center">' + (i.box ? '<svg width="12" height="9"><rect width="12" height="9" rx="1.5" fill="' + i.c + '"/></svg>' : '<svg width="24" height="8"><line x1="0" x2="24" y1="4" y2="4" stroke="' + i.c + '" stroke-width="2.2"' + (i.d ? ' stroke-dasharray="' + i.d + '"' : '') + '/></svg>') + e(i.n) + '</span>';
    }).join('') + '</div>';
  }
  function comments() {
    return S.report.comments.trim() ? '<h2>Reviewer comments</h2><div class="r-box comment"><div class="r-note" style="margin:0 0 3pt">Entered by the preparer — not generated from the schedule.</div>' + e(S.report.comments) + '</div>' : '';
  }

  /* ---------------- report bodies ---------------- */
  RP.build = function (id) {
    var R = S.R, CV = S.CV, m = S.model, land = S.report.orient === 'landscape';
    var W = land ? (S.report.paper === 'a4' ? 1000 : 940) : (S.report.paper === 'a4' ? 680 : 700);
    var html = '<div class="rpt">';
    if (id === 'exec') {
      html += header('Schedule Health — Executive Summary') + kpis() +
        '<h2>Summary</h2><div class="r-box"><div class="r-note" style="margin:0 0 3pt">Generated from the schedule data.</div>' + e(narrative()) + '</div>' + comments() +
        '<h2>DCMA 14-Point results</h2>' + dcmaTable() +
        '<h2>Progress</h2>' + scurve(W) +
        '<h2>Top fixes</h2>' + fixTable(R.fixes.slice(0, 8), true) +
        (R.fixes.length > 8 ? '<div class="r-note">' + (R.fixes.length - 8) + ' more items are in the Prioritized Fix List report.</div>' : '');
    }
    if (id === 'dcma') {
      html += header('DCMA 14-Point Detailed Assessment') + kpis() + '<h2>Summary</h2>' + dcmaTable() + comments();
      R.checks.forEach(function (c) {
        html += '<h2>' + c.n + '. ' + e(c.name) + ' — ' + pf(c) + '</h2>' +
          '<p><b>What it checks:</b> ' + e(c.means) + ' <b>Why it matters:</b> ' + e(c.why) + ' <b>How to fix:</b> ' + e(c.fix) + '</p>' +
          '<p><b>Result:</b> ' + e(c.metric) + ' (target ' + e(c.target) + ')' + (c.assessed && c.basis ? ' — ' + e(c.basis) : '') + (c.assessed ? '' : ' — not assessed: ' + e(c.naReason || '')) + '</p>';
        if (c.items.length) html += '<table><thead><tr><th>Activity ID</th><th>Activity name</th><th>Finding</th><th>Total float</th></tr></thead><tbody>' +
          c.items.map(function (it) { var a = m.byKey[it.key]; return '<tr><td style="white-space:nowrap">' + e(a.id) + '</td><td>' + e(a.name) + '</td><td>' + e(it.detail) + '</td><td>' + (a.tf == null ? '—' : Math.round(a.tf)) + '</td></tr>'; }).join('') + '</tbody></table>';
      });
    }
    if (id === 'fix') {
      var p = [1, 2, 3].map(function (n) { return R.fixes.filter(function (f) { return f.pri === n; }).length; });
      html += header('Prioritized Fix List') +
        '<p>' + R.fixes.length + ' items: <b>' + p[0] + ' Priority 1</b> (fix now — the forecast cannot be trusted until fixed), <b>' + p[1] + ' Priority 2</b> (fix this update), <b>' + p[2] + ' Priority 3</b> (review).</p>' + comments() + fixTable(R.fixes, false);
    }
    if (id === 'cp') {
      var cp = R.cp, path = cp.path.map(function (k) { return m.byKey[k]; });
      var neg = m.activities.filter(function (a) { return a.type !== 'wbs' && a.type !== 'loe' && a.status !== 'C' && a.tf != null && a.tf < -0.05; }).sort(function (a, b) { return a.tf - b.tf; });
      var actRows = function (list) { return '<table><thead><tr><th>Activity ID</th><th>Activity name</th><th>Status</th><th>Start</th><th>Finish</th><th>Baseline finish</th><th>Total float</th></tr></thead><tbody>' + list.map(function (a) { return '<tr><td style="white-space:nowrap">' + e(a.id) + '</td><td>' + e(a.name) + '</td><td>' + ({ NS: 'Not started', IP: 'In progress', C: 'Complete' }[a.status]) + '</td><td>' + U.fmt(a.start) + '</td><td>' + U.fmt(a.finish) + '</td><td>' + U.fmt(a.blFinish) + '</td><td>' + (a.tf == null ? '—' : Math.round(a.tf)) + '</td></tr>'; }).join('') + '</tbody></table>'; };
      html += header('Critical Path Review') + kpis() +
        '<h2>Critical path test</h2><div class="r-box">' + (cp.assessed ? 'A ' + S.th.cpTestDays + '-working-day delay was added to ' + e(m.byKey[cp.target].id) + ' ' + e(m.byKey[cp.target].name) + '. The project finish moved ' + cp.moved + ' days. Result: ' + (cp.pass ? '<span class="pf pass">✓ Pass</span> — the critical path is continuous.' : '<span class="pf fail">✕ Fail</span> — the path is broken by a constraint, open end or lag.') : 'Not assessed: ' + e(cp.reason)) + '</div>' + comments() +
        '<h2>Driving path (' + path.length + ' activities)</h2>' + actRows(path) +
        '<h2>Negative float (' + neg.length + ' activities)</h2>' + (neg.length ? actRows(neg) : '<p>None.</p>');
    }
    if (id === 'cost') {
      html += header('Cost & Manpower') + comments();
      var c = CV.cost;
      if (c) {
        var cw = CH.lineSVG({ width: W, height: 190, yFmt: function (v) { return U.money(v); }, ddDay: m.project.dataDay, gridColor: PC.grid, inkColor: PC.ink, ddColor: PC.dd, surface: PC.surf, ml: 62, title: 'Cumulative cost',
          series: [{ name: 'Budget', color: PC.base, dash: '7 5', pts: c.baseline }, { name: 'Actual', color: PC.act, pts: c.actual, endDot: true }, { name: 'Forecast', color: PC.fc, dash: '2 5', pts: c.forecast }] });
        html += '<h2>Cost</h2><div class="r-kpis">' +
          '<div class="r-kpi"><span>Budget at completion</span><b>' + U.money(c.BAC) + '</b><i>Sum of budgeted cost</i></div>' +
          '<div class="r-kpi"><span>Actual cost</span><b>' + U.money(c.AC) + '</b><i>To the data date</i></div>' +
          '<div class="r-kpi"><span>Forecast at completion</span><b>' + U.money(c.EAC) + '</b><i>' + (c.VAC < 0 ? U.money(-c.VAC) + ' over budget' : U.money(c.VAC) + ' under budget') + '</i></div>' +
          '<div class="r-kpi"><span>CPI / SPI</span><b>' + (c.CPI == null ? 'n/a' : c.CPI.toFixed(2)) + ' / ' + (c.SPI == null ? 'n/a' : c.SPI.toFixed(2)) + '</b><i>Earned value ' + U.money(c.EV) + '</i></div></div>' +
          '<div class="r-chart">' + legend([{ n: 'Budget plan', c: PC.base, d: '7 5' }, { n: 'Actual cost', c: PC.act }, { n: 'Forecast cost', c: PC.fc, d: '2 5' }]) + cw.svg +
          '<div class="r-note">EAC = actual cost to date + remaining cost from the schedule. CPI = earned value ÷ actual cost. SPI = earned value ÷ planned value.</div></div>';
      } else html += '<h2>Cost</h2><p>No cost is loaded in this schedule.</p>';
      var mp = CV.manpower;
      if (mp) {
        var cols = mp.series.map(function (n, i) { return n === 'Other' ? PC.other : PC.cats[i]; });
        var bw = CH.barsSVG({ width: W, height: 200, rows: mp.rows.map(function (r) { return { label: r.label, parts: r.byCraft, plan: r.plan, part: r.actualPart }; }), series: mp.series, colors: cols, planName: 'Baseline plan', planColor: PC.base, gridColor: PC.grid, surface: PC.surf, title: 'Monthly labor hours by craft', yFmt: function (v) { return v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v); } });
        html += '<h2>Manpower</h2><div class="r-chart">' + legend(mp.series.map(function (n, i) { return { n: n, c: cols[i], box: true }; }).concat([{ n: 'Baseline plan (total)', c: PC.base, d: '7 5' }])) + bw.svg +
          '<div class="r-note">Monthly labor hours. Lighter bars are forecast after the data date. Budget ' + U.num(mp.budH) + ' h; forecast at completion ' + U.num(mp.eacH) + ' h.</div></div>' +
          '<h3>Monthly hours and average headcount</h3><table><thead><tr><th>Month</th><th>Hours</th><th>Headcount*</th><th>Baseline plan hours</th><th>Basis</th></tr></thead><tbody>' +
          mp.rows.map(function (r) { return '<tr><td>' + r.label + '</td><td>' + U.num(r.total) + '</td><td>' + SK.curves.headcount(r, S.opt.hoursPerPersonWeek).toFixed(1) + '</td><td>' + U.num(r.plan) + '</td><td>' + (r.actualPart === 'actual' ? 'Actual' : r.actualPart === 'mixed' ? 'Actual + forecast' : 'Forecast') + '</td></tr>'; }).join('') +
          '</tbody></table><div class="r-note">*Headcount = hours ÷ (' + S.opt.hoursPerPersonWeek + ' hours per person per week × weeks in the month).</div>';
      } else html += '<h2>Manpower</h2><p>No labor hours are loaded in this schedule.</p>';
    }
    return html + footer() + '</div>';
  };

  /* ---------------- print: write @page rule, copy report, open dialog ---------------- */
  RP.print = function (id) {
    var root = document.getElementById('print-root');
    var size = (S.report.paper === 'a4' ? 'A4' : 'letter') + ' ' + S.report.orient;
    var label = (S.model.project.code || '') + ' · Data date ' + U.fmt(S.model.project.dataDay);
    var st = document.getElementById('page-style');
    if (!st) { st = document.createElement('style'); st.id = 'page-style'; document.head.appendChild(st); }
    st.textContent = '@page { size: ' + size + '; margin: 0.5in 0.5in 0.6in; ' +
      '@bottom-left { content: "' + label.replace(/"/g, '') + '"; font: 8pt Inter, Arial, sans-serif; color: #6b7280; } ' +
      '@bottom-right { content: "Page " counter(page) " of " counter(pages); font: 8pt Inter, Arial, sans-serif; color: #6b7280; } }';
    root.innerHTML = RP.build(id);
    var done = function () { root.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(function () { window.print(); }, 60);
  };
})(window);

</script>
<script>
/* ===== tutorials.js ===== */
/* =====================================================================
   TUTORIALS — one guided tour per screen, the onboarding tour, the
   "How it works" story (read aloud) and the Help Center tasks.
   Edit the words here; control labels must match the screen exactly.
   ===================================================================== */
(function (root) {
  var SK = root.SK;
  var TU = SK.tutorials = {};
  var go = function (id) { return function () { if (SK.state.screen !== id) SK.app.go(id, { focus: false }); }; };

  TU.STORY = 'Welcome to the Shell Key DCMA Schedule Health Reviewer. ' +
    'If you build or review project schedules, you know the question that always comes up: can we trust this schedule? ' +
    'This tool answers it the way a Defense Contract Management Agency reviewer would, using the fourteen-point assessment that schedulers across construction, energy and government projects use as a quality guide. ' +
