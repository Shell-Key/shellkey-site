/* =====================================================================
   SHELL KEY DESIGN SYSTEM — tokens, layout, components, print
   ---------------------------------------------------------------------
   Change colors ONLY in the token blocks below.  Every screen, chart,
   tour and report preview reads these variables.
   ===================================================================== */

/* ---------- 1. TOKENS: Shell Key dark (default) ---------- */
:root {
  color-scheme: dark;
  --bg: #0a1320;          /* page */
  --nav: #0e1a2b;         /* sidebar + top bar */
  --panel: #111f32;       /* cards */
  --panel-2: #152640;     /* nested panel / hover */
  --border: #1f3149;
  --text: #e7eef7;
  --text-2: #dbe4f0;
  --text-3: #c3cfdd;      /* supporting text (≥ 4.5:1 on panel) */
  --accent: #7cff00;      /* primary actions */
  --on-accent: #0a1320;
  --focus: #7cff00;
  --info: #4f8ef7;  --warn: #f2a33a;  --bad: #ff5c6a;  --good: #3ddc84;  --purple: #9b7bff;
  --info-bg: rgba(79,142,247,.14); --warn-bg: rgba(242,163,58,.14); --bad-bg: rgba(255,92,106,.14); --good-bg: rgba(61,220,132,.14);
  /* chart semantics (never re-used for anything else) */
  --c-baseline: #9aa9bd; --c-forecast: #4f8ef7; --c-actual: #3ddc84; --c-grid: #1f3149; --c-dd: #f2a33a;
  /* craft categories (validated: dataviz validator, dark surface #111f32) */
  --cat1: #3987e5; --cat2: #d95926; --cat3: #199e70; --cat4: #c98500; --cat5: #d55181; --cat6: #008300; --cat-other: #7d8ca1;
  --radius: 12px; --radius-sm: 8px;
  --pad: 20px; --gap: 16px; --row-h: 44px;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px rgba(0,0,0,.25);
  --nav-w: 250px;
  --font: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
/* ---------- professional light ---------- */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f6fa; --nav: #ffffff; --panel: #ffffff; --panel-2: #eef3f9; --border: #d5dee9;
  --text: #0e1a2b; --text-2: #1d2b3e; --text-3: #435266;
  --accent: #5fd400; --on-accent: #0a1320; --focus: #1f5fd1;
  --info: #1f5fd1; --warn: #9a5b00; --bad: #c4283a; --good: #137a43; --purple: #6b4fd8;
  --info-bg: #e6eefc; --warn-bg: #fdf1df; --bad-bg: #fde8ea; --good-bg: #e2f5ea;
  --c-baseline: #6b7a8f; --c-forecast: #1f5fd1; --c-actual: #12884a; --c-grid: #e1e8f0; --c-dd: #b26a00;
  --cat1: #2a78d6; --cat2: #eb6834; --cat3: #1baf7a; --cat4: #eda100; --cat5: #e87ba4; --cat6: #008300; --cat-other: #8a97a8;
  --shadow: 0 1px 2px rgba(14,26,43,.06), 0 4px 14px rgba(14,26,43,.06);
}
/* ---------- high contrast ---------- */
:root[data-theme="contrast"] {
  --bg: #000; --nav: #000; --panel: #000; --panel-2: #141414; --border: #ffffff;
  --text: #fff; --text-2: #fff; --text-3: #f0f0f0;
  --accent: #b6ff4d; --on-accent: #000; --focus: #ffff00;
  --info: #8fb8ff; --warn: #ffc266; --bad: #ff8a94; --good: #6dffb0;
  --info-bg: #000; --warn-bg: #000; --bad-bg: #000; --good-bg: #000;
  --c-baseline: #d0d0d0; --c-forecast: #8fb8ff; --c-actual: #6dffb0; --c-grid: #555; --c-dd: #ffc266;
  --shadow: none;
}
:root[data-density="compact"] { --pad: 14px; --gap: 12px; --row-h: 38px; }
html { font-size: 100%; }
:root[data-scale="115"] { font-size: 115%; }
:root[data-scale="130"] { font-size: 130%; }

/* ---------- 2. BASE ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.5; -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; color: var(--text); }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 650; }
h3 { font-size: 1rem; font-weight: 650; }
p { margin: 0 0 .75em; }
a { color: var(--info); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 999; background: var(--accent); color: var(--on-accent); padding: 10px 14px; border-radius: 8px; font-weight: 700; }
.skip:focus { top: 12px; }
.muted { color: var(--text-3); }
.small { font-size: .875rem; }
.mono { font-family: var(--mono); font-size: .92em; }
.nowrap { white-space: nowrap; }
.sel { user-select: text; }

/* ---------- 3. LAYOUT ---------- */
.app { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh; }
:root[data-nav="collapsed"] { --nav-w: 76px; }
.sidebar { background: var(--nav); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; z-index: 40; }
.brand { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
.logo-chip { background: #fff; border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; justify-content: center; min-height: 52px; }
.logo-chip img { max-width: 100%; max-height: 44px; display: block; }
.brand-name { font-weight: 700; font-size: .95rem; line-height: 1.3; }
.brand-sub { font-size: .8rem; color: var(--text-3); }
.nav { padding: 10px 10px 16px; flex: 1; }
.nav-group { margin-top: 14px; }
.nav-group > .label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 0 10px 6px; font-weight: 650; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 8px 12px; border: 0; background: transparent; color: var(--text-2); border-radius: 10px; cursor: pointer; text-align: left; font-size: .95rem; }
.nav button:hover { background: var(--panel-2); color: var(--text); }
.nav button[aria-current="page"] { background: var(--panel-2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); font-weight: 650; }
.nav svg { width: 20px; height: 20px; flex: none; }
.nav .count { margin-left: auto; font-size: .75rem; background: var(--bad-bg); color: var(--bad); border-radius: 999px; padding: 1px 8px; font-weight: 700; }
:root[data-nav="collapsed"] .nav button span.t, :root[data-nav="collapsed"] .nav-group > .label, :root[data-nav="collapsed"] .brand-name, :root[data-nav="collapsed"] .brand-sub, :root[data-nav="collapsed"] .nav .count, :root[data-nav="collapsed"] .side-foot .t { display: none; }
:root[data-nav="collapsed"] .nav button { justify-content: center; padding: 8px; }
:root[data-nav="collapsed"] .logo-chip { padding: 6px; }
.side-foot { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.edition { font-size: .8rem; color: var(--text-3); }
.topbar { position: sticky; top: 0; z-index: 30; background: var(--nav); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 64px; flex-wrap: wrap; }
.topbar .title { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.topbar .title h1 { font-size: 1.2rem; }
.ctx { font-size: .85rem; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.topbar .menu-btn { display: none; }
main { padding: 20px; max-width: 1600px; width: 100%; margin: 0 auto; }
.scrim { display: none; }

@media (max-width: 1023px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; left: 0; top: 0; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  :root[data-nav="collapsed"] .sidebar { width: min(300px, 86vw); }
  :root[data-nav="collapsed"] .nav button span.t, :root[data-nav="collapsed"] .nav-group > .label, :root[data-nav="collapsed"] .brand-name, :root[data-nav="collapsed"] .brand-sub, :root[data-nav="collapsed"] .side-foot .t { display: initial; }
  :root[data-nav="collapsed"] .nav button { justify-content: flex-start; padding: 8px 12px; }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 35; }
  .topbar .menu-btn { display: inline-flex; }
  .collapse-btn { display: none !important; }
  main { padding: 14px; }
  .topbar { padding: 8px 12px; gap: 8px; }
}
@media (max-width: 479px) { .btn { white-space: normal; text-align: center; } main .row > .btn { max-width: 100%; } }
@media (max-width: 599px) {
  .top-actions .hide-sm span { display: none; }
  .top-actions .btn { padding: 8px 12px; }
  .topbar .title { flex-basis: 150px; }
}

/* ---------- 4. COMPONENTS ---------- */
.grid { display: grid; gap: var(--gap); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.kpis { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); }
@media (max-width: 599px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .kpi .k-value { font-size: 1.35rem; } .kpis .card { padding: 12px; } }
.stack { display: flex; flex-direction: column; gap: var(--gap); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--pad); box-shadow: var(--shadow); min-width: 0; }

.card > header p { margin: 2px 0 0; }
.card.nest { background: var(--panel-2); box-shadow: none; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .k-label { font-size: .85rem; color: var(--text-3); font-weight: 600; }
.kpi .k-value { font-size: 1.75rem; font-weight: 750; letter-spacing: -.01em; line-height: 1.15; }
.kpi .k-sub { font-size: .85rem; color: var(--text-2); }
.kpi button.k-link { all: unset; cursor: pointer; }
button.kpi { text-align: left; cursor: pointer; color: inherit; font: inherit; }

.page-head { display: flex; gap: 12px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
.page-head p { margin: 4px 0 0; color: var(--text-2); max-width: 75ch; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer; font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: .9rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.icon-btn { min-width: 44px; padding: 8px; }

.badge { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.b-pass { background: var(--good-bg); color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.b-fail { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.b-info { background: var(--info-bg); color: var(--info); border-color: color-mix(in srgb, var(--info) 40%, transparent); }
.b-na { background: transparent; color: var(--text-3); border-color: var(--border); }
.b-warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.p1 { background: var(--bad-bg); color: var(--bad); }
.p2 { background: var(--warn-bg); color: var(--warn); }
.p3 { background: var(--info-bg); color: var(--info); }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--panel-2); margin-bottom: 16px; }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--border)); }
.banner.info { border-color: color-mix(in srgb, var(--info) 50%, var(--border)); }
.banner .b-ico { flex: none; font-weight: 800; }
.banner p { margin: 0; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .field > label { font-size: .875rem; font-weight: 600; color: var(--text-2); }
.input, select.input, textarea.input { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); width: 100%; }
textarea.input { min-height: 90px; resize: vertical; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.filters .field { flex: 1 1 170px; max-width: 280px; }
.filters .field.grow { flex: 2 1 220px; max-width: 420px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 14px; min-height: 40px; cursor: pointer; color: var(--text-2); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -3px 0 var(--accent); }

/* tables: contained scroll, sticky header + first column */
.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); max-height: 70vh; }
table.data { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .92rem; }
table.data th, table.data td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
table.data thead th { position: sticky; top: 0; background: var(--panel-2); z-index: 2; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); white-space: nowrap; }
table.data td.sticky, table.data th.sticky { position: sticky; left: 0; background: var(--panel); z-index: 1; }
table.data thead th.sticky { z-index: 3; background: var(--panel-2); }
table.data tbody tr:hover td { background: var(--panel-2); }
table.data tbody tr.clickable { cursor: pointer; }
table.data .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data td.what { min-width: 280px; }
table.data td.why { min-width: 220px; color: var(--text-2); }
.neg { color: var(--bad); font-weight: 700; }
.pos { color: var(--good); }

/* cards view for phones (fix list, activities) */
.cards-list { display: none; flex-direction: column; gap: 10px; }
.mini-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; }
.mini-card h4 { font-size: .98rem; margin: 6px 0 4px; }
.mini-card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: .9rem; }
.mini-card dt { color: var(--text-3); }
.mini-card dd { margin: 0; }
@media (max-width: 719px) {
  .has-cards .table-wrap { display: none; }
  .has-cards .cards-list { display: flex; }
}

/* DCMA tiles */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
.tile { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--panel-2); text-align: left; cursor: pointer; color: inherit; min-height: 84px; display: flex; flex-direction: column; gap: 4px; }
.tile:hover { border-color: var(--text-3); }
.tile .t-n { font-size: .78rem; color: var(--text-3); font-weight: 650; }
.tile .t-name { font-weight: 650; font-size: .92rem; line-height: 1.25; }
.tile .t-val { font-size: .88rem; margin-top: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tile.fail { box-shadow: inset 4px 0 0 var(--bad); }
.tile.pass { box-shadow: inset 4px 0 0 var(--good); }
.tile.na { box-shadow: inset 4px 0 0 var(--border); }

/* dashboard top row: grade card + KPI grid */
.dash-top { display: grid; gap: var(--gap); grid-template-columns: minmax(0, 340px) minmax(0, 1fr); align-items: start; }
@media (max-width: 899px) { .dash-top { grid-template-columns: minmax(0, 1fr); } }
/* even card grids (Help Center): same height per row, buttons pinned to the bottom */
.grid.even { align-items: stretch; grid-auto-rows: 1fr; }
.grid.even > .card { display: flex; flex-direction: column; }
.grid.even > .card > .card-foot { margin-top: auto; padding-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: flex-start; }
.grid.even > .card.nest .card-foot .btn { background: var(--panel); }
@media (max-width: 719px) { .grid.even { grid-auto-rows: auto; } }
/* report-style dashboard: even rows */
.dash-kpis { display: grid; gap: var(--gap); grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 1fr; }
@media (max-width: 1099px) { .dash-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.dash-kpis .card { display: flex; flex-direction: column; gap: 4px; justify-content: flex-start; }
.dash-kpis .kpi-grade { flex-direction: row; align-items: center; gap: 14px; }
.kpi-grade svg { flex: none; }
.kpi-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
@media (max-width: 599px) { .dash-kpis { gap: 10px; } .dash-kpis .kpi-grade { flex-direction: column; align-items: flex-start; } .kpi-grade svg { width: 60px; height: 60px; } }
.tiles.t7 { grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 1fr; }
@media (max-width: 1279px) { .tiles.t7 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); } }
.dash-2 { display: grid; gap: var(--gap); grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; }
@media (max-width: 1023px) { .dash-2 { grid-template-columns: minmax(0, 1fr); } }
.dash-2 > .card { display: flex; flex-direction: column; }
.dash-2 .chart-note { margin-top: auto; padding-top: 8px; }
.empty.grow { flex: 1; display: flex; align-items: center; justify-content: center; }
.mini-stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
@media (max-width: 599px) { .mini-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mini-stat { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.mini-stat b { font-size: 1.05rem; }
.fx-rows { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.fx-row { display: grid; grid-template-columns: 44px 76px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; min-height: 48px; }
.fx-row:last-child { border-bottom: 0; }
.fx-row:hover { background: var(--panel-2); }
.fx-name { display: flex; flex-direction: column; min-width: 0; }
.fx-name b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* grade ring */
.grade { display: flex; gap: 18px; align-items: center; }
.grade svg { flex: none; }
.grade .letter { font-size: 2.6rem; font-weight: 800; }

/* check rows on the DCMA screen */
.check { scroll-margin-top: 84px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); margin-bottom: 10px; box-shadow: var(--shadow); }
.check > button.head { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; width: 100%; cursor: pointer; border-radius: var(--radius); }
.check > button.head:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.check .num-dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--panel-2); border: 1px solid var(--border); }
.check .c-name { font-weight: 700; }
.check .c-meta { font-size: .88rem; color: var(--text-2); }
.check .c-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
.check .c-metric { font-weight: 750; font-size: 1.05rem; }
.check .body { padding: 0 16px 16px 72px; display: none; }
.check.open .body { display: block; }
@media (max-width: 599px) {
  .check > button.head { grid-template-columns: 36px minmax(0,1fr); }
  .check .c-right { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
  .check .body { padding: 0 14px 14px; }
}
.explain { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); margin: 6px 0 12px; }
.explain div { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.explain b { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin-bottom: 2px; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg text { font-family: var(--font); fill: var(--text-3); font-size: 12px; }
.chart .tip { position: absolute; pointer-events: none; background: var(--nav); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: .85rem; box-shadow: 0 8px 20px rgba(0,0,0,.3); min-width: 160px; z-index: 5; display: none; }
.chart .tip b { display: block; margin-bottom: 4px; }
.chart .tip .r { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .88rem; color: var(--text-2); margin: 4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend svg { width: 28px; height: 10px; }
.chart-note { font-size: .82rem; color: var(--text-3); margin-top: 8px; }
.empty { padding: 24px; text-align: center; color: var(--text-3); border: 1px dashed var(--border); border-radius: var(--radius); }

/* gantt */
.gantt-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.gantt { display: grid; grid-template-columns: minmax(220px, 300px) minmax(640px, 1fr); min-width: 900px; }
.gantt .gh { position: sticky; top: 0; background: var(--panel-2); font-size: .8rem; font-weight: 700; color: var(--text-2); padding: 8px 10px; border-bottom: 1px solid var(--border); }
.gantt .gl { position: sticky; left: 0; background: var(--panel); z-index: 1; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: .88rem; min-height: 46px; border-right: 1px solid var(--border); cursor: pointer; }
.gantt .gl:hover { background: var(--panel-2); }
.gantt .gb { position: relative; border-bottom: 1px solid var(--border); min-height: 46px; }
.gantt .bar { position: absolute; height: 12px; border-radius: 4px; }
.gantt .bar.bl { top: 28px; height: 6px; background: var(--c-baseline); opacity: .8; }
.gantt .bar.cur { top: 10px; background: var(--c-forecast); }
.gantt .bar.cur.neg { background: var(--bad); }
.gantt .bar.cur.done { background: var(--c-actual); }
.gantt .ms { position: absolute; top: 9px; width: 14px; height: 14px; transform: rotate(45deg); background: var(--c-forecast); }
.gantt .ddline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--c-dd); }

/* drop zone */
.drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 28px; text-align: center; background: var(--panel-2); }
.drop.over { border-color: var(--accent); }
.drop h3 { margin-bottom: 6px; }

/* drawer + dialog */
.drawer-scrim, .dialog-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 80; display: none; }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel); border-left: 1px solid var(--border); z-index: 81; transform: translateX(102%); transition: transform .2s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer:not(.open) { visibility: hidden; }
body { overflow-x: clip; } /* the closed drawer sits off-screen to the right */
.drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.drawer-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
.kv { display: grid; grid-template-columns: minmax(110px, auto) minmax(0, 1fr); gap: 6px 14px; font-size: .92rem; margin: 0 0 14px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 479px) { .kv { grid-template-columns: minmax(0, 1fr); } .kv dt { margin-top: 6px; } }
.dialog { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); z-index: 91; padding: 20px; display: none; }
.dialog-scrim { z-index: 90; }

/* toast */
.toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; width: min(520px, calc(100vw - 24px)); }
.toast { background: var(--nav); border: 1px solid var(--border); border-left: 4px solid var(--info); border-radius: 10px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); } .toast.warn { border-left-color: var(--warn); }

/* ---------- 5. TOUR ---------- */
.tour-hl { position: fixed; z-index: 100; border-radius: 12px; box-shadow: 0 0 0 4px var(--accent), 0 0 0 9999px rgba(3,8,15,.55); pointer-events: none; transition: all .2s ease; display: none; }
.tour-card { position: fixed; z-index: 101; width: min(420px, calc(100vw - 24px)); background: var(--nav); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 18px 50px rgba(0,0,0,.45); padding: 16px; display: none; max-height: calc(100dvh - 24px); overflow-y: auto; }
.tour-card .t-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.tour-card .t-step { font-size: .82rem; color: var(--text-3); font-weight: 650; }
.tour-card h3 { margin-bottom: 6px; }
.tour-card .t-body { color: var(--text-2); font-size: .98rem; }
.tour-card .t-nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.tour-card .t-nav .spacer { flex: 1; }
.progress { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; margin: 6px 0 10px; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.voice { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; display: grid; gap: 8px; }
.voice .row { gap: 6px; }
.voice select { min-height: 36px; padding: 4px 8px; flex: 1 1 160px; }
.voice input[type=range] { flex: 1 1 120px; accent-color: var(--accent); }
.voice .v-status { font-size: .8rem; color: var(--text-3); }
.how-step { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: start; }
.how-step .n { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--border); font-weight: 800; color: var(--accent); }
:root[data-theme="light"] .how-step .n { color: var(--text); box-shadow: inset 0 -3px 0 var(--accent); }
.hero { display: grid; gap: var(--gap); grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: stretch; }
@media (max-width: 899px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero h2 { font-size: 1.6rem; margin-bottom: 8px; }
.price { font-size: 2.6rem; font-weight: 800; }
.price small { font-size: 1rem; color: var(--text-3); font-weight: 600; }
ul.ticks { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; }
ul.ticks li::before { content: "✓"; color: var(--good); font-weight: 800; margin-right: 10px; }

/* report preview (white page on screen) */
.paper-wrap { background: #c9d2dd; border-radius: var(--radius); padding: 18px; overflow-x: auto; }
:root[data-theme="light"] .paper-wrap { background: #dfe6ee; }
.paper { background: #fff; color: #111827; margin: 0 auto; padding: 0.6in 0.55in; box-shadow: 0 6px 20px rgba(0,0,0,.25); width: 8.5in; max-width: 100%; font-family: var(--font); font-size: 10.5pt; }
.paper.landscape { width: 11in; }
.paper.a4 { width: 210mm; } .paper.a4.landscape { width: 297mm; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- 6. REPORT TYPOGRAPHY (print scale, white page) ---------- */
.rpt { color: #111827; font-family: var(--font); font-size: 10pt; line-height: 1.4; }
.rpt h1 { color: #0e1a2b; font-size: 17pt; margin: 0 0 2pt; }
.rpt h2 { color: #0e1a2b; font-size: 12.5pt; margin: 14pt 0 6pt; border-bottom: 1.5pt solid #0e1a2b; padding-bottom: 3pt; break-after: avoid; }
.rpt h3 { color: #0e1a2b; font-size: 10.5pt; margin: 10pt 0 4pt; break-after: avoid; }
.rpt .r-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14pt; border-bottom: 3pt solid #0e1a2b; padding-bottom: 8pt; margin-bottom: 10pt; }
.rpt .r-head img { height: 40pt; }
.rpt .r-meta { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4pt 12pt; font-size: 8.5pt; color: #374151; margin-bottom: 8pt; }
.rpt .r-meta b { display: block; color: #111827; font-size: 9pt; }
.rpt table { width: 100%; border-collapse: collapse; font-size: 8.6pt; }
.rpt th { background: #0e1a2b; color: #fff; text-align: left; padding: 4pt 5pt; font-weight: 600; }
.rpt td { padding: 3.5pt 5pt; border-bottom: .6pt solid #d1d5db; vertical-align: top; }
.rpt tr { break-inside: avoid; }
.rpt thead { display: table-header-group; }
.rpt .r-kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6pt; margin: 6pt 0 8pt; }
.rpt .r-kpi { border: .8pt solid #cbd5e1; border-radius: 4pt; padding: 6pt 8pt; break-inside: avoid; }
.rpt .r-kpi span { display: block; font-size: 7.8pt; color: #4b5563; text-transform: uppercase; letter-spacing: .04em; }
.rpt .r-kpi b { font-size: 14pt; color: #0e1a2b; }
.rpt .r-kpi i { display: block; font-style: normal; font-size: 8pt; color: #374151; }
.rpt .pf { font-weight: 700; white-space: nowrap; }

       Weekend days map to the following Monday.

<script>
/* ===== parsers.js ===== */
/* =====================================================================
   SCHEDULE IMPORT ADAPTERS
   ---------------------------------------------------------------------
   Reads three formats into ONE normalized model (see makeModel below):
     • Primavera P6 XER          (text, tab-separated tables)
     • Primavera P6 XML          (APIBusinessObjects)
     • Microsoft Project XML     (File → Save As → XML in MS Project)
   Native .mpp is binary and cannot be read in a browser — the user is
   told exactly how to save it as XML instead.

   Units after import:  durations & float in WORKING DAYS (hours ÷ the
   activity calendar's hours-per-day), dates as day numbers (util.js),
   percent complete as 0–1.
   ===================================================================== */
(function (root) {
  var SK = root.SK = root.SK || {};
  var U = SK.util;
  var P = SK.parsers = {};

  /* ---------- constraint vocabulary shared by all formats ---------- */
  P.CSTR_LABEL = {
    SO: 'Start On', SNLT: 'Start On or Before', SNET: 'Start On or After',
    FO: 'Finish On', FNLT: 'Finish On or Before', FNET: 'Finish On or After',
    MSO: 'Mandatory Start', MFO: 'Mandatory Finish', ALAP: 'As Late As Possible'
  };
  /* DCMA "hard" constraints = those that stop logic moving the date */
  P.HARD = { SO: 1, SNLT: 1, FO: 1, FNLT: 1, MSO: 1, MFO: 1 };

  var XML_CSTR = { 'Start On': 'SO', 'Start On or Before': 'SNLT', 'Start On or After': 'SNET', 'Finish On': 'FO', 'Finish On or Before': 'FNLT', 'Finish On or After': 'FNET', 'As Late As Possible': 'ALAP', 'Mandatory Start': 'MSO', 'Mandatory Finish': 'MFO' };
  var MSP_CSTR = { '1': 'ALAP', '2': 'MSO', '3': 'MFO', '4': 'SNET', '5': 'SNLT', '6': 'FNET', '7': 'FNLT' };

    return {
      format: format, fileName: fileName || '',
      project: { id: '', code: '', name: '', dataDay: null, dataHour: null, startDay: null, mustFinishDay: null, scheduledFinishDay: null, baselineSource: '' },

  function finalize(m) {

      p.succs.push(r); s.preds.push(r); return true;
    });

    var hasC = m.activities.some(function (a) { return a.budC > 0; });
    m.stats = {
      activities: m.activities.length,
      rels: m.rels.length,
      resourceLoaded: hasH, costLoaded: hasC,
      byType: m.activities.reduce(function (o, a) { o[a.type] = (o[a.type] || 0) + 1; return o; }, {}),

<script>
/* ===== dcma.js ===== */
/* =====================================================================

   ---------------------------------------------------------------------
   POPULATIONS (stated on screen and in reports):
     • "Incomplete activities" = Task, Resource-dependent and milestone

       activities are always left out.
     • "Relationships" = links where the predecessor or successor is
       incomplete.

(function (root) {

  /* -------- plain-English meaning of every check (used on screens,

  D.INFO = {
    1: { name: 'Logic', short: 'Missing logic', means: 'Every unfinished activity should have at least one predecessor and one successor.', why: 'An activity with an open end does not push anything later when it slips, so the finish date can look better than it really is.', fix: 'Tie the open end to the work it really drives or depends on.' },
    2: { name: 'Leads', short: 'Lead (negative lag)', means: 'No relationship should have a negative lag.', why: 'A negative lag lets work start before its predecessor finishes in a way nobody can track; it hides overlap and can pull dates in unrealistically.', fix: 'Replace the lead with a Start-to-Start link and a positive lag, or split the activity.' },
    3: { name: 'Lags', short: 'Lag', means: 'No more than 5% of relationships should carry a positive lag.', why: 'Lags are invisible waiting time. Work that takes time (curing, delivery, review) should be its own activity so it can be statused.', fix: 'Replace the lag with a real activity, or reduce it where it is not needed.' },
    4: { name: 'Relationship types', short: 'Non-FS link', means: 'At least 90% of relationships should be Finish-to-Start.', why: 'Finish-to-Start logic is the clearest to read and to status. Heavy use of SS/FF links makes the critical path hard to follow.', fix: 'Confirm each SS/FF link is needed; change it to Finish-to-Start where the work really is sequential.' },
    5: { name: 'Hard constraints', short: 'Hard constraint', means: 'No more than 5% of unfinished activities should have a hard constraint (Must Start/Finish On, Start/Finish On or Before, Mandatory).', why: 'Hard constraints stop logic from moving dates, which can hide delays and create false negative float.', fix: 'Use a soft constraint (Start On or After) or logic instead, unless the date is contractual — then note why.' },
    6: { name: 'High float', short: 'High float', means: 'No more than 5% of unfinished activities should have more than 44 working days of total float.', why: 'Very high float usually means missing logic, so the activity is not connected to the work that should follow it.', fix: 'Check its successors; add the missing tie so its float reflects reality.' },

    14: { name: 'BEI', short: 'BEI', means: 'Baseline Execution Index should be 0.95 or higher: activities finished ÷ activities due by now.', why: 'BEI shows whether work is being finished at the rate the baseline planned.', fix: 'Focus crews on the overdue activities and confirm the baseline is still realistic.' }
  };

    var target = pj.mustFinishDay;
    var targetSrc = target != null ? 'Must-finish-by date' : '';
    if (target == null) { net.forEach(function (a) { if (a.blFinish != null && (target == null || a.blFinish > target)) target = a.blFinish; }); targetSrc = 'Baseline finish'; }

    function netPreds(a) { return a.preds.filter(function (r) { return inNet(byKey[r.pred]); }).length + (a.extPred || 0); }
    function netSuccs(a) { return a.succs.filter(function (r) { return inNet(byKey[r.succ]); }).length; }

    var checks = [];
    function add(n, o) { var c = Object.assign({ n: n, items: [], assessed: true }, D.INFO[n], o); checks.push(c); return c; }

    /* 1 LOGIC */
    var c1 = [];
    inc.forEach(function (a) {
      var np = netPreds(a), ns = netSuccs(a);
      var startBoundary = a.type === 'start' && np === 0;
      var finishBoundary = a.type === 'finish' && ns === 0 && a.finish != null && lastFinish != null && a.finish >= lastFinish;
      var noP = np === 0 && !startBoundary, noS = ns === 0 && !finishBoundary;
      if (noP || noS) c1.push({ key: a.key, detail: noP && noS ? 'No predecessor and no successor' : noP ? 'No predecessor' : 'No successor', noP: noP, noS: noS });
    });
    add(1, { items: c1, value: pct(c1.length, inc.length), metric: U.pct(pct(c1.length, inc.length)), target: '≤ ' + th.logicPct + '%', pass: pct(c1.length, inc.length) * 100 <= th.logicPct, basis: c1.length + ' of ' + inc.length + ' incomplete activities' });

    /* 2 LEADS */
    var c2 = relsInc.filter(function (r) { return r.lag < -0.001; }).map(function (r) { return { key: r.succ, rel: r, detail: byKey[r.pred].id + ' → ' + byKey[r.succ].id + ' ' + r.type + ' ' + fmtLag(r.lag) }; });
    add(2, { items: c2, value: c2.length, metric: String(c2.length), target: '≤ ' + th.leadsMax, pass: c2.length <= th.leadsMax, basis: c2.length + ' of ' + relsInc.length + ' relationships' });

    /* 3 LAGS */
    var c3 = relsInc.filter(function (r) { return r.lag > 0.001; }).map(function (r) { return { key: r.succ, rel: r, detail: byKey[r.pred].id + ' → ' + byKey[r.succ].id + ' ' + r.type + ' ' + fmtLag(r.lag) }; });
    add(3, { items: c3, value: pct(c3.length, relsInc.length), metric: U.pct(pct(c3.length, relsInc.length)), target: '≤ ' + th.lagsPct + '%', pass: pct(c3.length, relsInc.length) * 100 <= th.lagsPct, basis: c3.length + ' of ' + relsInc.length + ' relationships' });

    /* 4 RELATIONSHIP TYPES */
    var nonFS = relsInc.filter(function (r) { return r.type !== 'FS'; });
    var fsShare = relsInc.length ? 1 - nonFS.length / relsInc.length : 1;
    add(4, { items: nonFS.map(function (r) { return { key: r.succ, rel: r, detail: byKey[r.pred].id + ' → ' + byKey[r.succ].id + ' ' + r.type + (r.lag ? ' ' + fmtLag(r.lag) : '') }; }),
      value: fsShare, metric: U.pct(fsShare) + ' FS', target: '≥ ' + th.fsMinPct + '% FS', pass: fsShare * 100 >= th.fsMinPct, assessed: relsInc.length > 0, basis: (relsInc.length - nonFS.length) + ' of ' + relsInc.length + ' relationships are FS' });

    /* 5 HARD CONSTRAINTS */
    var c5 = inc.filter(function (a) { return a.cstr.some(function (c) { return P.HARD[c.type]; }); })
      .map(function (a) { var c = a.cstr.filter(function (c) { return P.HARD[c.type]; })[0]; return { key: a.key, detail: (c.label || P.CSTR_LABEL[c.type]) + ' ' + U.fmt(c.day), cstr: c }; });
    add(5, { items: c5, value: pct(c5.length, inc.length), metric: U.pct(pct(c5.length, inc.length)), target: '≤ ' + th.hardCstrPct + '%', pass: pct(c5.length, inc.length) * 100 <= th.hardCstrPct, basis: c5.length + ' of ' + inc.length + ' incomplete activities' });

    /* 6 HIGH FLOAT */
    var withTF = inc.filter(function (a) { return a.tf != null; });
    var c6 = withTF.filter(function (a) { return a.tf > th.highFloatDays; }).map(function (a) { return { key: a.key, detail: 'Total float ' + Math.round(a.tf) + ' days', tf: a.tf }; });
    add(6, { items: c6, value: pct(c6.length, inc.length), metric: U.pct(pct(c6.length, inc.length)), target: '≤ ' + th.highFloatPct + '% over ' + th.highFloatDays + 'd', pass: pct(c6.length, inc.length) * 100 <= th.highFloatPct, assessed: withTF.length > 0, basis: c6.length + ' of ' + inc.length + ' incomplete activities', naReason: 'The file has no total float values.' });

    /* 7 NEGATIVE FLOAT */
    var c7 = withTF.filter(function (a) { return a.tf < -0.05; }).map(function (a) { return { key: a.key, detail: 'Total float ' + (Math.round(a.tf * 10) / 10) + ' days', tf: a.tf }; });
    add(7, { items: c7, value: c7.length, metric: String(c7.length), target: '≤ ' + th.negFloatMax, pass: c7.length <= th.negFloatMax, assessed: withTF.length > 0, basis: c7.length + ' of ' + inc.length + ' incomplete activities (' + U.pct(pct(c7.length, inc.length)) + ')', naReason: 'The file has no total float values.' });

    /* 8 HIGH DURATION */
    var c8 = incTasks.filter(function (a) { var d = opt.durationBasis === 'remaining' ? a.remDur : a.origDur; return d > th.highDurDays; })
      .map(function (a) { var d = opt.durationBasis === 'remaining' ? a.remDur : a.origDur; return { key: a.key, detail: (opt.durationBasis === 'remaining' ? 'Remaining' : 'Original') + ' duration ' + Math.round(d) + ' days', dur: d }; });
    add(8, { items: c8, value: pct(c8.length, incTasks.length), metric: U.pct(pct(c8.length, incTasks.length)), target: '≤ ' + th.highDurPct + '% over ' + th.highDurDays + 'd', pass: pct(c8.length, incTasks.length) * 100 <= th.highDurPct, basis: c8.length + ' of ' + incTasks.length + ' incomplete activities with duration (' + opt.durationBasis + ' duration)' });

    /* 9 INVALID DATES */
    var c9 = [];
    net.forEach(function (a) {
      if (a.actStart != null && a.actStart > dd) c9.push({ key: a.key, detail: 'Actual start ' + U.fmt(a.actStart) + ' is after the data date', kind: 'actual' });
      else if (a.actFinish != null && a.actFinish > dd) c9.push({ key: a.key, detail: 'Actual finish ' + U.fmt(a.actFinish) + ' is after the data date', kind: 'actual' });
      else if (a.status === 'NS' && a.start != null && a.start < dd) c9.push({ key: a.key, detail: 'Forecast start ' + U.fmt(a.start) + ' is before the data date', kind: 'forecast' });
      else if (a.status !== 'C' && a.finish != null && a.finish < dd) c9.push({ key: a.key, detail: 'Forecast finish ' + U.fmt(a.finish) + ' is before the data date', kind: 'forecast' });
    });
    add(9, { items: c9, value: c9.length, metric: String(c9.length), target: '≤ ' + th.invalidMax, pass: c9.length <= th.invalidMax, basis: c9.length + ' activities (all statuses checked)' });

    /* 10 RESOURCES (informational) */
    var loaded = model.activities.some(function (a) { return a.hasRsrc || a.budC > 0; });
    var c10 = loaded ? incTasks.filter(function (a) { return a.origDur > 0 && !a.hasRsrc && !(a.budC > 0); }).map(function (a) { return { key: a.key, detail: 'No hours or cost assigned' }; }) : [];
    add(10, { items: c10, value: pct(c10.length, incTasks.length), metric: loaded ? U.pct(pct(c10.length, incTasks.length)) + ' without' : 'Not loaded', target: 'Informational', pass: null, info: true, assessed: loaded, basis: loaded ? c10.length + ' of ' + incTasks.length + ' incomplete activities have no resources' : '', naReason: 'The schedule is not resource- or cost-loaded.' });

    /* 11 MISSED TASKS + 14 BEI share the "baseline due" population */
    var hasBL = net.some(function (a) { return a.blFinish != null; });
    var due = net.filter(function (a) { return a.blFinish != null && a.blFinish <= dd; });
    var c11 = due.filter(function (a) { return a.actFinish == null || a.actFinish > a.blFinish; }).map(function (a) {
      return { key: a.key, detail: a.actFinish == null ? 'Not finished — baseline finish ' + U.fmt(a.blFinish) : 'Finished ' + U.workdaysBetween(a.blFinish, a.actFinish) + ' days late (' + U.fmt(a.actFinish) + ' vs ' + U.fmt(a.blFinish) + ')', open: a.actFinish == null };
    });
    add(11, { items: c11, value: pct(c11.length, due.length), metric: U.pct(pct(c11.length, due.length)), target: '≤ ' + th.missedPct + '%', pass: pct(c11.length, due.length) * 100 <= th.missedPct, assessed: hasBL && due.length > 0, basis: c11.length + ' of ' + due.length + ' activities due by the data date', naReason: hasBL ? 'No activities were due by the data date.' : 'The file has no baseline dates.' });

    /* 12 CRITICAL PATH TEST (check engine) */
    var runOpts = { dataDay: dd, dataHour: pj.dataHour, deadlineDay: pj.mustFinishDay };
    var cp = SK.cpm.criticalPathTest(model, runOpts, th.cpTestDays);
    var c12items = [];
    if (cp.assessed && !cp.pass) c12items.push({ key: cp.target, detail: 'Added ' + th.cpTestDays + ' days here; finish moved ' + cp.moved + ' days' });
    add(12, { items: c12items, value: cp.assessed ? (cp.pass ? 1 : 0) : null, metric: cp.assessed ? (cp.pass ? 'Passed' : 'Failed') : 'Not assessed', target: 'Finish moves ' + th.cpTestDays + 'd',
      pass: cp.assessed ? cp.pass : null, assessed: cp.assessed, basis: cp.assessed ? ('Delay added to ' + byKey[cp.target].id + '; project finish moved ' + cp.moved + ' working days') : '', naReason: cp.reason, cp: cp });

    /* 13 CPLI — uses the file's forecast finish and the completion target */
    var fFinish = null; inc.forEach(function (a) { if (a.finish != null && (fFinish == null || a.finish > fFinish)) fFinish = a.finish; });
    var cpl = fFinish != null ? U.workdaysBetween(dd, fFinish) + 1 : 0;
    var tfToTarget = (target != null && fFinish != null) ? U.workdaysBetween(fFinish, target) : null;
    var cpli = cpl > 0 && tfToTarget != null ? (cpl + tfToTarget) / cpl : null;
    add(13, { value: cpli, metric: cpli == null ? 'Not assessed' : trunc2(cpli), target: '≥ ' + th.cpliMin.toFixed(2), pass: cpli == null ? null : cpli >= th.cpliMin - 1e-9, assessed: cpli != null,
      basis: cpli == null ? '' : '(' + cpl + ' critical path days ' + (tfToTarget >= 0 ? '+ ' : '− ') + Math.abs(tfToTarget) + ' days float to ' + targetSrc.toLowerCase() + ') ÷ ' + cpl, naReason: 'Needs a forecast finish and a completion target (must-finish date or baseline).' });

    /* 14 BEI */
    var completed = net.filter(function (a) { return a.status === 'C' && a.actFinish != null && a.actFinish <= dd; }).length;
    var bei = due.length ? completed / due.length : null;
    add(14, { value: bei, metric: bei == null ? 'Not assessed' : trunc2(bei), target: '≥ ' + th.beiMin.toFixed(2), pass: bei == null ? null : bei >= th.beiMin - 1e-9, assessed: hasBL && due.length > 0,
      basis: bei == null ? '' : completed + ' completed ÷ ' + due.length + ' due by the data date', naReason: hasBL ? 'No activities were due by the data date.' : 'The file has no baseline dates.' });

    checks.forEach(function (c) { if (!c.assessed) c.pass = null; });

    /* ---------------- GRADE ---------------- */
    var graded = checks.filter(function (c) { return c.assessed && !c.info; });
    var passed = graded.filter(function (c) { return c.pass; }).length;
    var score = graded.length ? passed / graded.length : 0;
    var grade = score >= 0.9 ? 'A' : score >= 0.8 ? 'B' : score >= 0.7 ? 'C' : score >= 0.6 ? 'D' : 'F';

    /* ---------------- EXTRA: circular logic ---------------- */
    var loops = cp.base.cycles || [];

    /* ---------------- engine vs file float agreement ---------------- */
    var cmp = 0, agree = 0;
    inc.forEach(function (a) { var r = cp.base.res[a.key]; if (a.tf != null && r && r.tf != null) { cmp++; if (Math.abs(r.tf - a.tf) <= 1.01) agree++; } });

    var result = {
      checks: checks, passed: passed, graded: graded.length, score: score, grade: grade,
      population: { incomplete: inc.length, incompleteTasks: incTasks.length, rels: relsInc.length, due: due.length, total: net.length },
      cp: cp, loops: loops, targetDay: target, targetSrc: targetSrc, forecastFinish: fFinish,
      daysLate: (target != null && fFinish != null) ? U.workdaysBetween(target, fFinish) : null,
      engineAgreement: cmp ? agree / cmp : null, engineCompared: cmp, th: th, opt: opt
    };
    result.fixes = D.fixList(model, result);
    return result;
  };

  /* indexes are truncated (0.946 shows 0.94) so a failing value never displays as the target */
  function trunc2(v) { return (Math.floor(v * 100 + 1e-9) / 100).toFixed(2); }
  function fmtLag(l) { return (l > 0 ? '+' : '') + (Math.round(l * 10) / 10) + 'd'; }

  /* ---------------- suggestion: likely tie for an open end ---------------- */
  function suggest(model, a, wantSucc) {
    var best = null, bestGap = Infinity;
    model.activities.forEach(function (b) {
      if (b === a || !inNet(b) || b.wbsPath !== a.wbsPath) return;
      if (wantSucc) {
        if (b.status === 'C' || b.start == null || a.finish == null) return;
        var g = b.start - a.finish; if (g >= 0 && g < bestGap) { bestGap = g; best = b; }
      } else {
        if (b.finish == null || a.start == null) return;
        var g2 = a.start - b.finish; if (g2 >= 0 && g2 < bestGap) { bestGap = g2; best = b; }
      }
    });
    return best;
  }

  /* =================================================================
     FIX LIST — one row per activity per problem, ordered by priority
       P1 Fix now        — the forecast cannot be trusted until fixed
       P2 Fix this update — weakens the schedule; fix before issuing
       P3 Review          — confirm or clean up when time allows
     ================================================================= */
  D.fixList = function (model, R) {
    var out = [], byKey = model.byKey, th = R.th, dd = model.project.dataDay;
    function chk(n) { return R.checks.filter(function (c) { return c.n === n; })[0]; }
    function row(pri, n, a, what, why, extra) {
      out.push(Object.assign({ pri: pri, n: n, check: D.INFO[n] ? D.INFO[n].name : extra.checkName, key: a ? a.key : '', id: a ? a.id : '—', name: a ? a.name : (model.project.name || 'Project'),
        what: what, why: why, wbs: a ? a.wbsPath : '', contractor: a ? a.contractor : '', start: a ? (a.start != null ? a.start : 0) : -1 }, extra || {}));
    }

    /* circular logic — always P1 */
    (R.loops || []).forEach(function (loop) {
      var ids = loop.map(function (k) { return byKey[k].id; }).join(' → ');
      loop.forEach(function (k) { row(1, 0, byKey[k], 'Break the loop ' + ids + ' → ' + byKey[loop[0]].id + ' by removing the link that is not real.', 'Circular logic makes dates impossible to calculate; the scheduling tool cannot give a valid finish.', { checkName: 'Circular logic' }); });
    });

    /* 1 logic */
    var c = chk(1);
    c.items.forEach(function (it) {
      var a = byKey[it.key], tips = [];
      if (it.noS) { var s = suggest(model, a, true); tips.push('Add a successor' + (s ? ' — likely ' + s.id + ' ' + s.name + ' (check it)' : ' — the work that cannot start until this finishes')); }
      if (it.noP) { var p = suggest(model, a, false); tips.push('Add a predecessor' + (p ? ' — likely ' + p.id + ' ' + p.name + ' (check it)' : ' — the work that must happen first')); }
      row(c.pass ? 3 : 1, 1, a, tips.join('. ') + '.', it.detail + ': a slip here will not move the dates that depend on it.');
    });

    /* 9 invalid dates */
    chk(9).items.forEach(function (it) {
      var a = byKey[it.key];
      row(1, 9, a, it.kind === 'actual' ? 'Correct the actual date to on or before the data date (' + U.fmt(dd) + '), or remove it if the work has not happened yet.' : 'Reschedule at the data date ' + U.fmt(dd) + ' (P6: F9). If it really started, enter the actual start.',
        it.detail + '. Dates after this one are not reliable until it is fixed.');
    });

    /* 12 critical path test */
    var c12 = chk(12);
    if (c12.assessed && !c12.pass) {
      row(1, 12, byKey[c12.cp.target], 'Trace the driving path after this activity and remove the break (hard constraint, open end or lag) that stops the delay reaching the finish.',
        'A ' + th.cpTestDays + '-day delay here moved the finish only ' + c12.cp.moved + ' days, so the critical path is broken.');
    }

    /* 7 negative float — near-term work first */
    var c7 = chk(7);
    c7.items.slice().sort(function (x, y) { return byKey[x.key].tf - byKey[y.key].tf; }).forEach(function (it) {
      var a = byKey[it.key], soon = a.start != null && U.workdaysBetween(dd, a.start) <= 60;
      var need = Math.ceil(-a.tf);
      row(soon ? 1 : 2, 7, a, 'Recover ' + need + ' day' + (need === 1 ? '' : 's') + ': shorten remaining duration, add crew or overtime, or re-sequence with approval.' + (a.cstr.some(function (c) { return P.HARD[c.type]; }) ? ' It also has a hard constraint — confirm that date is required.' : ''),
        'Float is ' + (Math.round(a.tf * 10) / 10) + ' days, so this work cannot meet the required date as planned' + (soon ? ' — it starts within 60 working days.' : '.'));
    });

    /* 2 leads */
    chk(2).items.forEach(function (it) {
      var p = byKey[it.rel.pred], s = byKey[it.rel.succ];
      row(2, 2, s, 'Remove the ' + fmtLag(it.rel.lag) + ' lead on ' + p.id + ' → ' + s.id + ' (' + it.rel.type + '). Use a Start-to-Start link with a positive lag, or split ' + p.id + '.',
        'A negative lag lets work start before its predecessor is done in a way no one can status.');
    });

    /* 5 hard constraints */
    var c5 = chk(5);
    c5.items.forEach(function (it) {
      var a = byKey[it.key];
      var soft = /^(FO|FNLT|MFO)$/.test(it.cstr.type) ? 'Finish On or After' : 'Start On or After';
      row(c5.pass ? 3 : 2, 5, a, 'Change "' + it.detail + '" to ' + soft + ', or replace it with logic. If the date is contractual, keep it and add a note explaining why.',
        'A hard constraint stops logic from moving this date, which can hide a delay or create false negative float.');
    });

    /* 6 high float */
    var c6 = chk(6), openSucc = {};
    chk(1).items.forEach(function (it) { if (it.noS) openSucc[it.key] = 1; });
    c6.items.forEach(function (it) {
      var a = byKey[it.key];
      row(c6.pass ? 3 : 2, 6, a, openSucc[it.key] ? 'Add the missing successor (see the Logic row for this activity) — that will bring the float down.' : 'Check that every activity that really depends on this work is tied to it.',
        Math.round(a.tf) + ' days of float (limit ' + th.highFloatDays + ') usually means the activity is not connected to the work after it.');
    });

    /* 11 missed tasks */
    var c11 = chk(11);
    c11.items.forEach(function (it) {
      var a = byKey[it.key];
      row(c11.pass ? 3 : 2, 11, a, it.open ? 'If it is finished, enter the actual finish. If not, update remaining duration to a realistic forecast and record the reason for the delay.' : 'No schedule change needed — record the cause of the late finish for the update narrative.',
        it.detail + '.');
    });

    /* 8 high duration */
    var c8 = chk(8);
    c8.items.forEach(function (it) {
      var a = byKey[it.key];
      row(3, 8, a, 'Split into shorter steps of ' + th.highDurDays + ' working days or less that can be measured, or note why it stays long (vendor fabrication, LOE).',
        it.detail + ' — long activities are hard to status and hide detail.');
    });

    /* 3 lags */
    chk(3).items.forEach(function (it) {
      var p = byKey[it.rel.pred], s = byKey[it.rel.succ];
      row(3, 3, s, 'Replace the ' + fmtLag(it.rel.lag) + ' lag on ' + p.id + ' → ' + s.id + ' with a real activity (cure, delivery, review) or remove it if not needed.',
        'A lag is waiting time nobody can status.');
    });

    /* 4 relationship types — only listed when the check fails */
    var c4 = chk(4);
    if (!c4.pass) c4.items.forEach(function (it) {
      var p = byKey[it.rel.pred], s = byKey[it.rel.succ];
      row(3, 4, s, 'Confirm the ' + it.rel.type + ' link ' + p.id + ' → ' + s.id + ' is needed; change to Finish-to-Start if the work is really sequential.', 'Too many SS/FF links make the critical path hard to follow.');
    });

    /* 10 resources */
    chk(10).items.forEach(function (it) {
      row(3, 10, byKey[it.key], 'Add the crew hours or cost for this work.', 'Without resources this work is missing from the manpower and cost curves.');
    });

    /* project-level rows */
    var c13 = chk(13), c14 = chk(14);
    if (c13.assessed && !c13.pass) row(1, 13, null, 'Build a recovery plan on the driving path (see Critical Path screen) or get approval to move the required finish.', 'CPLI is ' + c13.metric + ' (target ' + c13.target + '): the remaining critical path is too tight to finish on time.');
    if (c14.assessed && !c14.pass) row(2, 14, null, 'Work the Missed Tasks rows first, then check whether the baseline is still achievable.', 'BEI is ' + c14.metric + ' (target ' + c14.target + '): work is finishing slower than planned.');

    out.sort(function (x, y) { return x.pri - y.pri || x.n - y.n || x.start - y.start || String(x.id).localeCompare(String(y.id)); });
    out.forEach(function (r, i) { r.no = i + 1; });
    return out;
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ===== curves.js ===== */
/* =====================================================================
   PROGRESS, MANPOWER AND COST CURVES
   ---------------------------------------------------------------------
   RULES (also printed under each chart):
   • Baseline curve  = weight spread evenly over each activity's baseline
                       working days.
   • Actual curve    = earned weight spread over each activity's ACTUAL
                       start → actual finish (or → data date if in
                       progress).  An XER holds only the current status,
                       not past period snapshots, so this curve is labeled
                       "estimated from actual dates".  It stops at the
                       data date.
   • Forecast curve  = earned to date + remaining weight spread over the
                       current remaining dates.  Starts at the data date.
   • Weight          = budgeted labor hours, else budgeted cost, else
                       original duration (shown on screen).  LOE and WBS
                       summary rows are excluded from progress weighting.
   ===================================================================== */
(function (root) {
  var SK = root.SK = root.SK || {};
  var U = SK.util;
  var CV = SK.curves = {};

  /* fraction of [s,f] (day numbers, f inclusive) done by day t, in work days */
  function frac(s, f, t) {
    if (s == null || f == null) return 0;
    var a = U.wd(s), b = U.wd(f) + 1, x = U.wd(t) + 1;
    if (b <= a) return t >= s ? 1 : 0;
    return Math.max(0, Math.min(1, (x - a) / (b - a)));
  }

  CV.basis = function (model, pref) {
    var loaded = model.activities.some(function (a) { return a.budH > 0 && a.type !== 'loe'; });
    var costed = model.activities.some(function (a) { return a.budC > 0 && a.type !== 'loe'; });
    if (pref === 'hours' && loaded) return 'hours';
    if (pref === 'cost' && costed) return 'cost';
    if (pref === 'duration') return 'duration';
    return loaded ? 'hours' : costed ? 'cost' : 'duration';
  };
  var BASIS_LABEL = { hours: 'budgeted labor hours', cost: 'budgeted cost', duration: 'original duration' };

  CV.build = function (model, opt) {
    opt = opt || SK.CONFIG.options;
    var pj = model.project, dd = pj.dataDay;
