  function money(v,compact=false){
    const opts={style:'currency',currency:state.settings.currency||'USD',maximumFractionDigits:compact?0:2};
    if(compact) opts.notation='compact';
    try{return new Intl.NumberFormat('en-US',opts).format(num(v));}catch(e){return '$'+num(v).toFixed(compact?0:2)}
  }
  function formatDate(s){if(!s)return '—';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
  function monthTx(year=selectedYear,month=selectedMonth){return state.transactions.filter(t=>{const d=new Date(t.date+'T12:00:00');return d.getFullYear()===year&&d.getMonth()===month;});}
  function yearTx(year=selectedYear){return state.transactions.filter(t=>new Date(t.date+'T12:00:00').getFullYear()===year);}
  function sumTx(list,type){return list.filter(t=>!type||t.type===type).reduce((s,t)=>s+num(t.amount),0)}
  function expenseByCategory(list){const out={};list.filter(t=>t.type==='expense').forEach(t=>out[t.category]=(out[t.category]||0)+num(t.amount));return out;}
  function totalBudget(){return Object.values(state.budgets).reduce((a,b)=>a+num(b),0)}
  function annualSeries(){return MONTHS.map((_,m)=>{const list=monthTx(selectedYear,m);return {income:sumTx(list,'income'),expense:sumTx(list,'expense')}})}
  function billStatus(b){
    const paid=monthTx().some(t=>t.type==='expense'&&t.name.toLowerCase().includes(b.name.toLowerCase().split(' ')[0])&&Math.abs(num(t.amount)-num(b.amount))<Math.max(15,num(b.amount)*.25));
    if(paid)return {label:'Paid',cls:'good'};
    const now=today.getFullYear()===selectedYear&&today.getMonth()===selectedMonth?today.getDate():1;
    if(b.dueDay<now)return {label:'Late',cls:'bad'};
    if(b.dueDay===now)return {label:'Due Today',cls:'bad'};
    if(b.dueDay-now<=5)return {label:'Due Soon',cls:'warn'};
    return {label:'Upcoming',cls:'info'};
  }
  function debtMonths(debt,extra=0){
    let bal=num(debt.balance),r=num(debt.apr)/1200,pay=num(debt.minPayment)+num(debt.extraPayment)+num(extra),months=0,interest=0;
    if(pay<=bal*r)return {months:999,interest:Infinity};
    while(bal>0&&months<1200){const i=bal*r;interest+=i;bal=Math.max(0,bal+i-pay);months++;}
    return {months,interest};
  }
  function monthsLabel(m){if(!isFinite(m)||m>=999)return 'Payment too low';const y=Math.floor(m/12),mo=m%12;return [y?`${y}y`:null,mo?`${mo}m`:null].filter(Boolean).join(' ')||'This month';}
  function healthScore(){
    const list=monthTx(),income=sumTx(list,'income'),expense=sumTx(list,'expense'),budget=totalBudget();
    let score=70;
    if(income>expense)score+=10;else score-=20;
    if(expense<=budget)score+=8;else score-=Math.min(18,Math.round((expense-budget)/Math.max(1,budget)*100));
    const savings=list.filter(t=>t.category==='Savings').reduce((s,t)=>s+num(t.amount),0);
    if(income&&savings/income>=.1)score+=7;
    const late=state.bills.filter(b=>billStatus(b).label==='Late').length;score-=late*5;
    return clamp(Math.round(score),0,100);
  }
  function getRecommendations(){

    const income=sumTx(list,'income'),savings=list.filter(t=>t.category==='Savings').reduce((s,t)=>s+num(t.amount),0);
    if(income&&savings/income<.1)recs.push({type:'warn',icon:'◎',title:'Savings rate is below 10%',text:`Current savings rate is ${pct(savings,income)}%. Consider an automatic transfer.`,action:'Open savings',page:'savings'});
    const highDebt=state.debts.find(d=>num(d.apr)>=18);if(highDebt)recs.push({type:'bad',icon:'↘',title:'High-interest debt needs attention',text:`${highDebt.name} has a ${num(highDebt.apr).toFixed(1)}% APR. Extra payments can reduce interest.`,action:'View payoff',page:'debt'});
    if(!recs.length)recs.push({type:'good',icon:'✓',title:'Financial plan is on track',text:'No major budget exceptions were identified for this month.',action:'Keep going',page:'dashboard'});
    return recs.slice(0,7);
  }

      `<h2>Debt Accounts</h2><p class="muted">Track balances, interest rates, minimum payments, and extra payments.</p><div class="list" style="margin-top:18px">${state.debts.map(d=>`<div class="list-item clickable" data-edit-debt="${d.id}"><div class="list-main"><strong>${esc(d.name)}</strong><span>${num(d.apr).toFixed(1)}% APR · Minimum ${money(d.minPayment)}</span></div><div class="list-side"><strong>${money(d.balance)}</strong></div></div>`).join('')}</div><button class="btn" style="margin-top:12px" data-action="add-debt">+ Add Debt</button>`,
      `<h2>Review and Activate</h2><p class="muted">The plan is ready. Review the summary below and save it as your starting point.</p><div class="grid equal" style="margin-top:18px">${kpi('Members',state.members.length,'People included','info')}${kpi('Accounts',state.accounts.length,'Financial accounts','teal')}${kpi('Monthly Budget',money(totalBudget()),'Planned category limits','warn')}${kpi('Savings Goals',state.goals.length,'Goals currently tracked','good')}${kpi('Debt Balance',money(state.debts.reduce((s,d)=>s+num(d.balance),0)),'Total tracked debt','bad')}${kpi('Plan Status',state.settings.setupComplete?'Active':'Draft','Ready for monthly use',state.settings.setupComplete?'good':'warn')}</div><div class="notice" style="margin-top:18px">After activation, use Transactions for daily entry. The Dashboard, Budget, Bills, Savings, Debt, and Reports screens update automatically.</div>`
    ];
    return sectionHead('Guided Household Setup','Complete the steps in order or click any section to update it')+`<div class="wizard"><div class="wizard-steps">${steps.map((s,i)=>`<div class="step ${i===wizardStep?'active':''} ${i<wizardStep||state.settings.setupComplete?'done':''}" data-step="${i}"><div class="step-num">${i<wizardStep||state.settings.setupComplete?'✓':i+1}</div><div><strong>${s[0]}</strong><small>${s[1]}</small></div></div>`).join('')}</div><div class="wizard-panel">${panels[wizardStep]}<div class="wizard-actions"><button class="btn" data-action="wizard-back" ${wizardStep===0?'disabled':''}>← Back</button><button class="btn primary" data-action="wizard-next">${wizardStep===steps.length-1?'Activate Plan':'Save & Continue →'}</button></div></div></div>`;
  }

  function renderTransactions(){
    const list=monthTx().sort((a,b)=>b.date.localeCompare(a.date));
    return sectionHead('Transactions',`${MONTHS[selectedMonth]} ${selectedYear} income and expense activity`,`<button class="btn" data-action="export-csv">Export CSV</button><button class="btn primary" data-action="add-transaction">+ Add Transaction</button>`)+
    `<div class="card"><div class="toolbar"><input id="txSearch" placeholder="Search description, category, account..."><select id="txType"><option value="all">All Types</option><option value="income">Income</option><option value="expense">Expenses</option></select><select id="txCategory"><option value="all">All Categories</option>${[...state.incomeCategories,...state.categories.map(c=>c.name)].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select><span class="muted" id="txCount">${list.length} records</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Account</th><th>Member</th><th>Type</th><th class="num">Amount</th></tr></thead><tbody id="txBody">${transactionRows(list)}</tbody></table></div></div>`;
  }
  function transactionRows(list){return list.length?list.map(t=>`<tr data-edit-tx="${t.id}"><td>${formatDate(t.date)}</td><td><strong>${esc(t.name)}</strong>${t.recurring?'<div class="muted">Recurring</div>':''}</td><td>${esc(t.category)}</td><td>${esc(t.account)}</td><td>${esc(t.member)}</td><td>${status(t.type==='income'?'Income':'Expense',t.type==='income'?'good':'info')}</td><td class="num ${t.type==='income'?'positive':''}">${t.type==='income'?'+':'−'}${money(t.amount)}</td></tr>`).join(''):`<tr><td colspan="7">${empty('No transactions','Add the first transaction for this month.')}</td></tr>`}

  function renderBudget(){
    const by=expenseByCategory(monthTx()),budget=totalBudget(),actual=Object.values(by).reduce((a,b)=>a+b,0),remaining=budget-actual;
    const rows=Object.entries(state.budgets).sort((a,b)=>a[0].localeCompare(b[0])).map(([cat,plan])=>{const act=by[cat]||0,rem=num(plan)-act,p=pct(act,plan),cls=p>100?'bad':p>=85?'warn':'';return `<div class="budget-row" data-edit-budget="${esc(cat)}"><div><strong>${esc(cat)}</strong><div class="muted">${esc((state.categories.find(c=>c.name===cat)||{}).group||'Other')}</div></div><div class="num">${money(plan)}</div><div class="num">${money(act)}</div><div class="num ${rem<0?'negative':'positive'}">${money(rem)}</div><div><div class="progress ${cls}"><span style="width:${clamp(p,0,100)}%"></span></div><div class="muted" style="margin-top:4px">${p}% used</div></div><div>${status(p>100?'Over Budget':p>=85?'Near Limit':act===0?'Not Started':'On Track',p>100?'bad':p>=85?'warn':act===0?'muted':'good')}</div></div>`}).join('');
    return sectionHead('Monthly Budget',`Plan versus actual for ${MONTHS[selectedMonth]} ${selectedYear}`,`<button class="btn" data-action="copy-budget">Copy to All Months</button><button class="btn primary" data-action="add-budget">+ Add Category</button>`)+
    `<div class="grid kpis">${kpi('Planned Budget',money(budget),'Total category plan','info')}${kpi('Actual Spending',money(actual),`${pct(actual,budget)}% of budget used`,'teal')}${kpi('Remaining',money(remaining),remaining>=0?'Still available':'Over the monthly plan',remaining>=0?'good':'bad')}${kpi('Largest Category',money(Math.max(0,...Object.values(by))),Object.entries(by).sort((a,b)=>b[1]-a[1])[0]?.[0]||'No spending','warn')}${kpi('Over Budget',Object.keys(state.budgets).filter(c=>(by[c]||0)>num(state.budgets[c])).length,'Categories needing action','bad')}</div>
    <div class="card flush"><div class="budget-row header"><div>Category</div><div class="num">Budget</div><div class="num">Actual</div><div class="num">Remaining</div><div>Usage</div><div>Status</div></div>${rows}</div>`;
  }

  function renderBills(){
    const bills=[...state.bills].sort((a,b)=>a.dueDay-b.dueDay),total=bills.reduce((s,b)=>s+num(b.amount),0),paid=bills.filter(b=>billStatus(b).label==='Paid').reduce((s,b)=>s+num(b.amount),0),late=bills.filter(b=>billStatus(b).label==='Late').length;
    return sectionHead('Bills & Recurring',`Recurring commitments for ${MONTHS[selectedMonth]} ${selectedYear}`,`<button class="btn primary" data-action="add-bill">+ Add Bill</button>`)+
    `<div class="grid kpis">${kpi('Monthly Commitments',money(total),'Total scheduled bills','info')}${kpi('Paid',money(paid),'Matched to monthly transactions','good')}${kpi('Remaining',money(total-paid),'Still expected this month','warn')}${kpi('Late Bills',late,'Require immediate attention',late?'bad':'good')}${kpi('Autopay Coverage',`${pct(bills.filter(b=>b.autopay).length,bills.length)}%`,'Bills using automatic payment','teal')}</div>
    <div class="card"><div class="list">${bills.length?bills.map(b=>{const s=billStatus(b);return `<div class="list-item clickable" data-edit-bill="${b.id}"><div class="list-main"><strong>${esc(b.name)}</strong><span>${esc(b.category)} · Due day ${b.dueDay} · ${b.autopay?'Autopay':'Manual payment'}</span></div><div class="list-side"><strong>${money(b.amount)}</strong>${status(s.label,s.cls)}</div></div>`}).join(''):empty('No bills configured','Add recurring bills to build the monthly calendar.')}</div></div>`;
  }

  function renderSavings(){
    const totalTarget=state.goals.reduce((s,g)=>s+num(g.target),0),funded=state.goals.reduce((s,g)=>s+num(g.current),0),monthly=state.goals.reduce((s,g)=>s+num(g.monthly),0);
    return sectionHead('Savings Goals','Create sinking funds and track progress toward future needs',`<button class="btn primary" data-action="add-goal">+ Add Goal</button>`)+
    `<div class="grid kpis">${kpi('Total Goal Value',money(totalTarget),'Combined savings targets','info')}${kpi('Currently Funded',money(funded),`${pct(funded,totalTarget)}% of all goals`,'good')}${kpi('Remaining',money(totalTarget-funded),'Still needed','warn')}${kpi('Monthly Contributions',money(monthly),'Planned automatic funding','teal')}${kpi('Goals Completed',state.goals.filter(g=>num(g.current)>=num(g.target)).length,`of ${state.goals.length} goals`,'good')}</div>
    <div class="goal-grid">${state.goals.map(g=>{const p=pct(g.current,g.target),remain=Math.max(0,num(g.target)-num(g.current)),months=g.monthly?Math.ceil(remain/num(g.monthly)):0;return `<div class="goal-card" data-edit-goal="${g.id}"><div class="goal-top"><div class="goal-icon">${esc(g.icon||'◎')}</div>${status(p>=100?'Complete':p>=75?'Nearly There':p>=35?'In Progress':'Starting',p>=100?'good':p>=75?'info':p>=35?'warn':'muted')}</div><h3>${esc(g.name)}</h3><div class="amount">${money(g.current)} <span class="muted" style="font-size:12px;font-weight:500">of ${money(g.target)}</span></div><div class="progress"><span style="width:${clamp(p,0,100)}%"></span></div><div class="goal-meta"><span>${p}% funded</span><span>${months?`~${months} months`:'No monthly plan'}</span></div><div class="goal-meta"><span>${money(g.monthly)}/month</span><span>${formatDate(g.targetDate)}</span></div></div>`}).join('')}</div>`;
  }

  function renderDebt(){
    const extra=num(state.settings.monthlyExtraDebt),total=state.debts.reduce((s,d)=>s+num(d.balance),0),minimum=state.debts.reduce((s,d)=>s+num(d.minPayment),0),highest=Math.max(0,...state.debts.map(d=>num(d.apr)));
    const order=[...state.debts].sort((a,b)=>num(b.apr)-num(a.apr));
    const rows=order.map((d,i)=>{const calc=debtMonths(d,i===0?extra:0),payment=num(d.minPayment)+num(d.extraPayment)+(i===0?extra:0);return `<div class="debt-card" data-edit-debt="${d.id}"><div><strong>${esc(d.name)}</strong><div class="muted">Priority ${i+1} by highest APR</div></div><div class="num">${money(d.balance)}</div><div class="num">${num(d.apr).toFixed(1)}%</div><div class="num">${money(payment)}</div><div><div class="progress"><span style="width:${clamp(100-num(d.balance)/Math.max(1,total)*100,5,100)}%"></span></div><div class="muted" style="margin-top:4px">${monthsLabel(calc.months)}</div></div><div class="num">${isFinite(calc.interest)?money(calc.interest):'—'}</div></div>`}).join('');
    return sectionHead('Debt Payoff','Use the avalanche strategy by default, with the highest APR first',`<button class="btn primary" data-action="add-debt">+ Add Debt</button>`)+
    `<div class="grid kpis">${kpi('Total Debt',money(total),'Tracked non-mortgage balances','bad')}${kpi('Minimum Payments',money(minimum),'Required monthly payments','warn')}${kpi('Extra Monthly Payment',money(extra),'Applied to the priority debt','teal')}${kpi('Highest APR',`${highest.toFixed(1)}%`,'Most expensive balance','bad')}${kpi('Debt Accounts',state.debts.length,'Balances being tracked','info')}</div>
    <div class="grid two"><div class="card flush"><div class="debt-card header"><div>Debt</div><div class="num">Balance</div><div class="num">APR</div><div class="num">Payment</div><div>Est. Payoff</div><div class="num">Interest</div></div>${rows||empty('No debts','Add a debt account to begin.')}</div><div class="card"><div class="card-title"><div><h2>Payoff Accelerator</h2><span>Test an additional monthly payment</span></div></div><div class="field"><label>Additional Amount Applied to Priority Debt</label><input id="extraDebt" type="number" min="0" step="25" value="${extra}"></div><div class="notice" style="margin-top:14px">With the current plan, the extra payment is applied to <strong>${esc(order[0]?.name||'the first debt')}</strong>. After payoff, roll the full payment into the next debt.</div><button class="btn teal" style="margin-top:14px" data-action="save-extra-debt">Update Scenario</button></div></div>`;
  }

  function renderNetWorth(){
    const assets=state.assets.reduce((s,a)=>s+num(a.value),0),liabs=state.liabilities.reduce((s,a)=>s+num(a.value),0),net=assets-liabs;
    const assetRows=state.assets.map(a=>`<div class="list-item clickable" data-edit-worth="asset:${a.id}"><div class="list-main"><strong>${esc(a.name)}</strong><span>${esc(a.type)}</span></div><div class="list-side"><strong>${money(a.value)}</strong></div></div>`).join('');
    const liabRows=state.liabilities.map(a=>`<div class="list-item clickable" data-edit-worth="liability:${a.id}"><div class="list-main"><strong>${esc(a.name)}</strong><span>${esc(a.type)}</span></div><div class="list-side"><strong>${money(a.value)}</strong></div></div>`).join('');
    return sectionHead('Net Worth','A simple balance sheet for your household',`<button class="btn" data-action="add-liability">+ Liability</button><button class="btn primary" data-action="add-asset">+ Asset</button>`)+
    `<div class="grid kpis">${kpi('Total Assets',money(assets),'Cash, property, and investments','good')}${kpi('Total Liabilities',money(liabs),'Loans and other obligations','bad')}${kpi('Net Worth',money(net),'Assets minus liabilities',net>=0?'teal':'bad')}${kpi('Debt-to-Asset',`${pct(liabs,assets)}%`,'Lower is generally stronger','warn')}${kpi('Liquid Assets',money(state.assets.filter(a=>['Cash','Investment'].includes(a.type)).reduce((s,a)=>s+num(a.value),0)),'Cash and investments','info')}</div>
    <div class="grid equal"><div class="card"><div class="card-title"><h2>Assets</h2><span>${money(assets)}</span></div><div class="list">${assetRows||empty('No assets','Add your first asset.')}</div></div><div class="card"><div class="card-title"><h2>Liabilities</h2><span>${money(liabs)}</span></div><div class="list">${liabRows||empty('No liabilities','Add your first liability.')}</div></div></div>`;
  }

  function renderInsights(){
    const list=monthTx(),income=sumTx(list,'income'),byGroup={Need:0,Want:0,Savings:0};
    list.filter(t=>t.type==='expense').forEach(t=>{const cat=state.categories.find(c=>c.name===t.category);const g=t.needWant&&['Need','Want','Savings'].includes(t.needWant)?t.needWant:(cat?.group||'Want');byGroup[g]=(byGroup[g]||0)+num(t.amount)});
    const recs=getRecommendations();
    const spendDays=new Set(list.filter(t=>t.type==='expense'&&t.category!=='Savings').map(t=>t.date)).size;
    const daysInMonth=new Date(selectedYear,selectedMonth+1,0).getDate(),noSpend=Math.max(0,daysInMonth-spendDays);
    return sectionHead('Financial Insights','Use behavior patterns to improve the plan, not just record history')+
    `<div class="grid two"><div class="card"><div class="card-title"><div><h2>50 / 30 / 20 View</h2><span>Needs, wants, and savings as a share of income</span></div></div><div class="rule-grid"><div class="rule-card needs"><h3>Needs</h3><div class="pct">${pct(byGroup.Need,income)}%</div><div>${money(byGroup.Need)} · Target ≤ 50%</div></div><div class="rule-card wants"><h3>Wants</h3><div class="pct">${pct(byGroup.Want,income)}%</div><div>${money(byGroup.Want)} · Target ≤ 30%</div></div><div class="rule-card savings"><h3>Savings & Debt</h3><div class="pct">${pct(byGroup.Savings,income)}%</div><div>${money(byGroup.Savings)} · Target ≥ 20%</div></div></div><div class="disclaimer">The 50/30/20 guideline is a planning framework, not a requirement. Housing costs, family size, debt, and local conditions may require a different target.</div></div>
    <div class="card"><div class="card-title"><div><h2>No-Spend Challenge</h2><span>Days without discretionary spending</span></div>${status(`${noSpend} days`,'good')}</div><div class="health"><div class="health-ring" style="--score:${pct(noSpend,daysInMonth)}"><b>${noSpend}</b></div><div class="health-copy"><h3>${noSpend>=15?'Strong spending discipline':noSpend>=8?'Building consistency':'Opportunity to improve'}</h3><p>A no-spend day excludes transfers to savings and essential bills. It is intended to highlight discretionary purchasing frequency.</p></div></div></div></div>
    <div class="card" style="margin-top:16px"><div class="card-title"><div><h2>Action Recommendations</h2><span>Click a recommendation to open the related screen</span></div></div>${recs.map(r=>`<div class="recommendation" data-nav="${r.page}"><div class="rec-icon ${r.type}">${r.icon}</div><div><h3>${esc(r.title)}</h3><p>${esc(r.text)}</p></div>${status(r.action,r.type==='bad'?'bad':r.type==='warn'?'warn':'good')}</div>`).join('')}</div>`;
  }

  function renderCalendar(){
    const first=new Date(selectedYear,selectedMonth,1),start=new Date(selectedYear,selectedMonth,1-first.getDay()),events={};
    monthTx().forEach(t=>{const d=new Date(t.date+'T12:00:00').getDate();(events[d]||(events[d]=[])).push({id:t.id,name:t.name,type:t.type==='income'?'income':'tx',amount:t.amount,kind:'tx'})});
    state.bills.forEach(b=>{const maxDay=new Date(selectedYear,selectedMonth+1,0).getDate();const day=Math.min(num(b.dueDay),maxDay);(events[day]||(events[day]=[])).push({id:b.id,name:b.name,type:'bill',amount:b.amount,kind:'bill'})});
    const cells=[];
    for(let i=0;i<42;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);
      const inMonth=d.getMonth()===selectedMonth,isToday=d.toDateString()===today.toDateString(),dateValue=iso(d.getFullYear(),d.getMonth(),d.getDate());
      const ev=inMonth?(events[d.getDate()]||[]):[];
      cells.push(`<div class="cal-day ${inMonth?'in-month':'out'} ${isToday?'today':''}" ${inMonth?`data-calendar-date="${dateValue}" title="Click to add a transaction on ${MONTHS[selectedMonth]} ${d.getDate()}"`:''}><div class="cal-num"><span>${d.getDate()}</span></div>${ev.slice(0,4).map(e=>`<button type="button" class="cal-event ${e.type}" data-calendar-event="${e.kind}:${e.id}" title="Click to edit ${esc(e.name)} — ${money(e.amount)}">${esc(e.name)} · ${money(e.amount,true)}</button>`).join('')}${ev.length>4?`<div class="muted">+${ev.length-4} more</div>`:''}</div>`)
    }
    return sectionHead('Financial Calendar',`${MONTHS[selectedMonth]} ${selectedYear} paydays, bills, and transactions`,`<button class="btn primary" data-action="add-transaction">+ Add Transaction</button>`)+`<div class="calendar-guide"><div><strong>Interactive calendar:</strong> Click an empty date to add a transaction. Click an item to edit it.</div><div class="calendar-legend"><span>Expense</span><span class="income">Income</span><span class="bill">Recurring bill</span></div></div><div class="card calendar-wrap"><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-head">${d}</div>`).join('')}${cells.join('')}</div></div>`;
  }

  function renderReports(){
    const series=annualSeries(),yearList=yearTx(),income=sumTx(yearList,'income'),expense=sumTx(yearList,'expense'),net=income-expense;
    const rows=series.map((x,i)=>`<tr><td>${MONTHS[i]}</td><td class="num">${money(x.income)}</td><td class="num">${money(x.expense)}</td><td class="num ${x.income-x.expense>=0?'positive':'negative'}">${money(x.income-x.expense)}</td><td class="num">${money(totalBudget())}</td><td>${status(x.expense<=totalBudget()?'Within Budget':'Over Budget',x.expense<=totalBudget()?'good':'bad')}</td></tr>`).join('');

    return sectionHead('Annual Reports',`${selectedYear} household financial performance`,`<button class="btn" data-action="export-csv">Export Transactions</button><button class="btn primary" data-action="print">Print Report</button>`)+
    `<div class="grid kpis">${kpi('Annual Income',money(income),'Recorded income','good')}${kpi('Annual Expenses',money(expense),'Recorded spending','info')}${kpi('Annual Cash Flow',money(net),net>=0?'Positive annual result':'Negative annual result',net>=0?'teal':'bad')}${kpi('Average Monthly Spend',money(expense/12),'Across all twelve months','warn')}${kpi('Savings Rate',`${pct(yearList.filter(t=>t.category==='Savings').reduce((s,t)=>s+num(t.amount),0),income)}%`,'Savings transfers divided by income','good')}</div>
    <div class="card"><div class="card-title"><div><h2>Monthly Performance</h2><span>Income, expenses, and budget result</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th class="num">Income</th><th class="num">Expenses</th><th class="num">Cash Flow</th><th class="num">Budget</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card" style="margin-top:16px"><div class="card-title"><div><h2>Annual Spending by Category</h2><span>Highest annual categories first</span></div></div>${cats.map(([c,v])=>`<div class="hbar-row"><div class="hbar-name">${esc(c)}</div><div class="hbar-track"><div class="hbar-fill" style="width:${v/Math.max(1,cats[0][1])*100}%"></div></div><div class="hbar-value">${money(v)}</div></div>`).join('')}</div>`;
  }

  function renderSettings(){
    const householdCard=`<div class="card"><div class="card-title"><div><h2>Household Settings</h2><span>General application preferences</span></div></div><div class="form-grid"><div class="field span-2"><label>Household Name</label><input id="settingsName" value="${esc(state.settings.householdName)}"></div><div class="field"><label>Default Plan Year</label><input id="settingsYear" type="number" value="${state.settings.year}"></div><div class="field"><label>Currency</label><select id="settingsCurrency"><option value="USD" ${state.settings.currency==='USD'?'selected':''}>USD</option><option value="CAD" ${state.settings.currency==='CAD'?'selected':''}>CAD</option><option value="EUR" ${state.settings.currency==='EUR'?'selected':''}>EUR</option><option value="GBP" ${state.settings.currency==='GBP'?'selected':''}>GBP</option></select></div><div class="field span-2"><label>Members — one per line</label><textarea id="settingsMembers">${esc(state.members.join('\n'))}</textarea></div></div><button class="btn primary" style="margin-top:14px" data-action="save-settings">Save Settings</button></div>`;
    const dataCard=DEMO_MODE?

    document.querySelectorAll('[data-edit-debt]').forEach(x=>x.addEventListener('click',()=>openDebt(x.dataset.editDebt)));
    document.querySelectorAll('[data-edit-budget]').forEach(x=>x.addEventListener('click',()=>openBudget(x.dataset.editBudget)));

  const TOUR_STEPS=[
    {page:'dashboard',selector:null,title:'Welcome to Family Finance',text:'This quick tour shows the recommended workflow. You can restart it anytime from Help or Settings & Data.'},
    {page:'setup',selector:'.wizard',title:'1. Build the Household Plan',text:'Use Guided Setup to enter household details, income, accounts, budget limits, recurring bills, savings goals, and debts.'},
    {page:'transactions',selector:'.table-wrap',title:'2. Record Income and Spending',text:'Use Add Transaction for each income or expense. Click any saved row to edit or delete it.'},
    {page:'budget',selector:'.budget-row.header',title:'3. Compare Budget to Actual',text:'The monthly budget shows the plan, actual transactions, remaining amount, percent used, and full status wording.'},
    {page:'bills',selector:'.list',title:'4. Track Recurring Bills',text:'Enter each recurring bill once. Due dates then appear automatically on the financial calendar.'},
    {page:'savings',selector:'.goal-grid',title:'5. Fund Savings Goals',text:'Create sinking funds for emergencies, vacations, repairs, education, or major purchases.'},
    {page:'debt',selector:'.debt-card.header',title:'6. Review the Debt Plan',text:'Enter balances, rates, and payments. Test extra payments to understand potential payoff timing.'},
    {page:'calendar',selector:'.calendar-wrap',title:'7. Use the Interactive Calendar',text:'Click an empty day to add a transaction with that date. Click an existing transaction or bill to edit it.'},
    {page:'dashboard',selector:'.grid.kpis',title:'8. Review the Dashboard',text:'Use the dashboard for monthly income, spending, cash flow, budget remaining, savings, bills, and recommendations.'},
    {page:'settings',selector:'[data-action="export-json"]',title:'9. Protect the Household Data',text:'Export a full backup regularly. The standalone file stores records in the browser and does not send them to a server.'}

  function startTutorial(index=0){
    closeModal();tourActive=true;tourIndex=clamp(index,0,TOUR_STEPS.length-1);document.getElementById('tourLayer').classList.add('show');showTourStep();
  }
  function showTourStep(){
    if(!tourActive)return;
    const step=TOUR_STEPS[tourIndex];
    if(step.page&&currentPage!==step.page){currentPage=step.page;document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));toggleMenu(false);render();setTimeout(showTourStep,90);return;}
    const card=document.getElementById('tourCard');
    card.innerHTML=`<div class="tour-progress">Step ${tourIndex+1} of ${TOUR_STEPS.length}</div><h2>${esc(step.title)}</h2><p>${esc(step.text)}</p><div class="tour-actions"><button class="tour-btn link" data-tour="skip">Skip tutorial</button><div class="tour-right">${tourIndex?'<button class="tour-btn" data-tour="back">Back</button>':''}<button class="tour-btn primary" data-tour="next">${tourIndex===TOUR_STEPS.length-1?'Finish':'Next'}</button></div></div>`;
    card.querySelectorAll('[data-tour]').forEach(btn=>btn.addEventListener('click',()=>{const action=btn.dataset.tour;if(action==='skip')finishTutorial(false);else if(action==='back'){tourIndex=Math.max(0,tourIndex-1);showTourStep()}else if(tourIndex===TOUR_STEPS.length-1)finishTutorial(true);else{tourIndex++;showTourStep()}}));
    const target=step.selector?document.querySelector(step.selector):null;
    if(target)target.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
    setTimeout(positionTour,target?260:20);
  }
  function setTourBox(id,left,top,width,height){const el=document.getElementById(id);el.style.left=`${Math.max(0,left)}px`;el.style.top=`${Math.max(0,top)}px`;el.style.width=`${Math.max(0,width)}px`;el.style.height=`${Math.max(0,height)}px`;}
  function positionTour(){
    if(!tourActive)return;
    const step=TOUR_STEPS[tourIndex],target=step.selector?document.querySelector(step.selector):null,vw=window.innerWidth,vh=window.innerHeight,card=document.getElementById('tourCard'),focus=document.getElementById('tourFocus');
    if(!target){setTourBox('tourShadeTop',0,0,vw,vh);['tourShadeLeft','tourShadeRight','tourShadeBottom'].forEach(id=>setTourBox(id,0,0,0,0));focus.style.display='none';card.style.left=`${Math.max(14,(vw-card.offsetWidth)/2)}px`;card.style.top=`${Math.max(14,(vh-card.offsetHeight)/2)}px`;return;}
    const raw=target.getBoundingClientRect(),pad=8,left=clamp(raw.left-pad,0,vw),top=clamp(raw.top-pad,0,vh),right=clamp(raw.right+pad,0,vw),bottom=clamp(raw.bottom+pad,0,vh);
    setTourBox('tourShadeTop',0,0,vw,top);setTourBox('tourShadeLeft',0,top,left,bottom-top);setTourBox('tourShadeRight',right,top,vw-right,bottom-top);setTourBox('tourShadeBottom',0,bottom,vw,vh-bottom);
    focus.style.display='block';setTourBox('tourFocus',left,top,right-left,bottom-top);
    const cw=card.offsetWidth,ch=card.offsetHeight,gap=16;let x,y;
    if(vw-right>=cw+gap){x=right+gap;y=top}else if(left>=cw+gap){x=left-cw-gap;y=top}else if(vh-bottom>=ch+gap){x=left;y=bottom+gap}else{x=left;y=top-ch-gap}
    card.style.left=`${clamp(x,14,vw-cw-14)}px`;card.style.top=`${clamp(y,14,vh-ch-14)}px`;
  }
  function finishTutorial(completed){
    tourActive=false;document.getElementById('tourLayer').classList.remove('show');state.settings.tutorialCompleted=true;storageSet(STORAGE_KEY,JSON.stringify(state));showToast(completed?'Tutorial completed':'Tutorial skipped — restart it from Help');

  function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
  function fieldVal(id){return document.getElementById(id)?.value||''}

  function openTransaction(id,presetDate){
    const t=state.transactions.find(x=>x.id===id)||{id:uid(),date:presetDate||iso(selectedYear,selectedMonth,Math.min(today.getDate(),new Date(selectedYear,selectedMonth+1,0).getDate())),type:'expense',name:'',category:'Groceries',amount:'',account:state.accounts[0]?.name||'Checking',member:state.members[0]||'Household',needWant:'Need',recurring:false,notes:''};
    const body=`<div class="form-grid"><div class="field"><label>Date</label><input id="fDate" type="date" value="${esc(t.date)}"></div><div class="field"><label>Type</label><select id="fType"><option value="expense" ${t.type==='expense'?'selected':''}>Expense</option><option value="income" ${t.type==='income'?'selected':''}>Income</option></select></div><div class="field span-2"><label>Description</label><input id="fName" value="${esc(t.name)}" placeholder="What was this transaction?"></div><div class="field"><label>Category</label><select id="fCategory">${[...state.incomeCategories,...state.categories.map(c=>c.name)].sort().map(c=>`<option ${c===t.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Amount</label><input id="fAmount" type="number" min="0" step="0.01" value="${num(t.amount)||''}"></div><div class="field"><label>Account</label><select id="fAccount">${state.accounts.map(a=>`<option ${a.name===t.account?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Household Member</label><select id="fMember">${state.members.map(m=>`<option ${m===t.member?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>Classification</label><select id="fNeed"><option ${t.needWant==='Need'?'selected':''}>Need</option><option ${t.needWant==='Want'?'selected':''}>Want</option><option ${t.needWant==='Savings'?'selected':''}>Savings</option><option ${t.needWant==='Income'?'selected':''}>Income</option></select></div><div class="field"><label>Recurring</label><select id="fRecurring"><option value="false" ${!t.recurring?'selected':''}>No</option><option value="true" ${t.recurring?'selected':''}>Yes</option></select></div><div class="field span-2"><label>Notes</label><textarea id="fNotes">${esc(t.notes)}</textarea></div></div>`;
    openModal(id?'Edit Transaction':'Add Transaction',body,()=>{const name=fieldVal('fName').trim(),amount=num(fieldVal('fAmount'));if(!name||amount<=0)return showToast('Description and amount are required');Object.assign(t,{date:fieldVal('fDate'),type:fieldVal('fType'),name,category:fieldVal('fCategory'),amount,account:fieldVal('fAccount'),member:fieldVal('fMember'),needWant:fieldVal('fNeed'),recurring:fieldVal('fRecurring')==='true',notes:fieldVal('fNotes')});if(!id)state.transactions.push(t);saveState();closeModal();render();},id?()=>confirmDelete('transaction',()=>{state.transactions=state.transactions.filter(x=>x.id!==id);saveState('Transaction deleted');closeModal();render();}):null);
  }
  function openBill(id){

  function exportDataCSV(){

    const rows=[];
    const push=o=>rows.push(head.map(h=>o[h]??''));
    push({RecordType:'SETTING',Name:'Household Name',SettingValue:state.settings.householdName});

    push({RecordType:'SETTING',Name:'Theme',SettingValue:state.settings.theme});

    state.categories.forEach(x=>push({RecordType:'CATEGORY',Name:x.name,Group:x.group}));
    state.incomeCategories.forEach(name=>push({RecordType:'INCOME_CATEGORY',Name:name}));
    Object.entries(state.budgets).forEach(([name,amount])=>push({RecordType:'BUDGET',Name:name,Category:name,BudgetAmount:amount,Group:(state.categories.find(c=>c.name===name)||{}).group||''}));
    state.transactions.forEach(x=>push({RecordType:'TRANSACTION',ID:x.id,Name:x.name,Date:x.date,TransactionType:x.type,Category:x.category,Amount:x.amount,Account:x.account,Member:x.member,Classification:x.needWant,Recurring:x.recurring?'Yes':'No',Notes:x.notes}));
    state.bills.forEach(x=>push({RecordType:'BILL',ID:x.id,Name:x.name,Category:x.category,Amount:x.amount,Account:x.account,DueDay:x.dueDay,Autopay:x.autopay?'Yes':'No',Frequency:x.frequency}));
    state.goals.forEach(x=>push({RecordType:'GOAL',ID:x.id,Name:x.name,Icon:x.icon,TargetAmount:x.target,CurrentAmount:x.current,MonthlyContribution:x.monthly,TargetDate:x.targetDate}));
    state.debts.forEach(x=>push({RecordType:'DEBT',ID:x.id,Name:x.name,Balance:x.balance,APR:x.apr,MinimumPayment:x.minPayment,ExtraPayment:x.extraPayment}));
    state.assets.forEach(x=>push({RecordType:'ASSET',ID:x.id,Name:x.name,Value:x.value,ItemType:x.type}));
    state.liabilities.forEach(x=>push({RecordType:'LIABILITY',ID:x.id,Name:x.name,Value:x.value,ItemType:x.type}));
    const csv=[head,...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
    state.settings.backupCreated=true;storageSet(STORAGE_KEY,JSON.stringify(state));
    download(`family-finance-editable-data-${selectedYear}.csv`,csv,'text/csv;charset=utf-8');showToast(DEMO_MODE?'Editable demo data exported':'Editable full data exported');if(currentPage==='dashboard'||currentPage==='settings')render();
  }
  function parseCSV(text){
    const rows=[];let row=[],field='',quoted=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++;}else if(c==='"'){quoted=false;}else field+=c;}
      else if(c==='"'){quoted=true;}else if(c===','){row.push(field);field='';}else if(c==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field='';}else field+=c;
    }
    if(field.length||row.length){row.push(field.replace(/\r$/,''));rows.push(row)}
    return rows.filter(r=>r.some(v=>String(v).trim()!==''));
  }
  function keyName(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'')}
  function boolValue(v){return ['yes','true','1','y','on'].includes(String(v||'').trim().toLowerCase())}
  function numberValue(v){return Number(String(v??'').replace(/[$,%\s]/g,'').replace(/,/g,''))||0}
  function dateValue(v){const s=String(v||'').trim();if(!s)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);return isNaN(d)?s:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function openCSVImport(){
    const body=`<div class="notice"><strong>CSV is the editable format.</strong> Export the application data first, edit it in Excel, keep the column headings unchanged, and import the file here.</div><div class="file-box" style="margin-top:14px"><strong>Select CSV file</strong><input id="csvDataFile" type="file" accept=".csv,text/csv"><div class="csv-note">The complete export uses a RecordType column so one CSV can contain transactions, budgets, bills, goals, debts, accounts, members, assets, liabilities, and settings.</div></div><div class="import-mode"><label class="import-option"><input type="radio" name="csvMode" value="replace-all" checked><span><strong>Replace All Data</strong><span>Remove the sample/current data and rebuild the system from the CSV. Use this after replacing the exported example rows with the customer’s information.</span></span></label><label class="import-option"><input type="radio" name="csvMode" value="replace-transactions"><span><strong>Replace Transactions Only</strong><span>Keep budgets, bills, goals, debts, and settings, but replace the transaction register.</span></span></label><label class="import-option"><input type="radio" name="csvMode" value="append-transactions"><span><strong>Append Transactions</strong><span>Add TRANSACTION rows to the existing register without removing current records.</span></span></label></div><div class="danger-note" style="margin-top:12px">Replace modes overwrite current records. Export a JSON backup first in the full version when working with real household data.</div>`;
    openModal('Import Editable CSV Data',body,()=>{const file=document.getElementById('csvDataFile').files[0],mode=document.querySelector('input[name="csvMode"]:checked')?.value||'replace-all';if(!file)return showToast('Select a CSV file first');importDataCSV(file,mode)});

  function importDataCSV(file,mode){
    const reader=new FileReader();
    reader.onload=()=>{try{
      const raw=parseCSV(String(reader.result||''));if(raw.length<2)throw new Error('The CSV is empty.');
      const headers=raw[0].map(keyName);const records=raw.slice(1).map(values=>{const o={};headers.forEach((h,i)=>o[h]=values[i]??'');return o});
      const get=(r,name)=>r[keyName(name)]??'';const hasRecordType=headers.includes('recordtype');
      const incoming={settings:{},members:[],accounts:[],categories:[],incomeCategories:[],budgets:{},transactions:[],bills:[],goals:[],debts:[],assets:[],liabilities:[]};
      records.forEach(r=>{const kind=hasRecordType?String(get(r,'RecordType')).trim().toUpperCase():'TRANSACTION';if(!kind||kind==='INSTRUCTIONS')return;const id=String(get(r,'ID')).trim()||uid(),name=String(get(r,'Name')||get(r,'Description')).trim();
        if(kind==='SETTING'){const key=name.toLowerCase(),value=get(r,'SettingValue');if(key.includes('household'))incoming.settings.householdName=value||'Family Household';else if(key.includes('year'))incoming.settings.year=numberValue(value)||today.getFullYear();else if(key==='currency')incoming.settings.currency=String(value||'USD').trim().toUpperCase();else if(key.includes('extra debt'))incoming.settings.monthlyExtraDebt=numberValue(value);else if(key==='theme')incoming.settings.theme=String(value).trim();else if(key==='layout')incoming.settings.layout=String(value).trim();}
        else if(kind==='MEMBER'&&name)incoming.members.push(name);
        else if(kind==='ACCOUNT'&&name)incoming.accounts.push({id,name,type:String(get(r,'AccountType')||'Checking').trim(),balance:numberValue(get(r,'Balance'))});
        else if(kind==='CATEGORY'&&name)incoming.categories.push({name,group:String(get(r,'Group')||'Need').trim()});
        else if(kind==='INCOME_CATEGORY'&&name)incoming.incomeCategories.push(name);
        else if(kind==='BUDGET'){const cat=name||String(get(r,'Category')).trim();if(cat)incoming.budgets[cat]=numberValue(get(r,'BudgetAmount')||get(r,'Amount'));}
        else if(kind==='TRANSACTION'&&name)incoming.transactions.push({id,date:dateValue(get(r,'Date')),type:String(get(r,'TransactionType')||'expense').trim().toLowerCase(),name,category:String(get(r,'Category')||'Other').trim(),amount:numberValue(get(r,'Amount')),account:String(get(r,'Account')||'Checking').trim(),member:String(get(r,'Member')||'Household').trim(),needWant:String(get(r,'Classification')||'Need').trim(),recurring:boolValue(get(r,'Recurring')),notes:String(get(r,'Notes')||'')});
        else if(kind==='BILL'&&name)incoming.bills.push({id,name,category:String(get(r,'Category')||'Other').trim(),amount:numberValue(get(r,'Amount')),dueDay:clamp(numberValue(get(r,'DueDay'))||1,1,31),autopay:boolValue(get(r,'Autopay')),account:String(get(r,'Account')||'Checking').trim(),frequency:String(get(r,'Frequency')||'Monthly').trim()});
        else if(kind==='GOAL'&&name)incoming.goals.push({id,name,icon:String(get(r,'Icon')||'◎'),target:numberValue(get(r,'TargetAmount')),current:numberValue(get(r,'CurrentAmount')),monthly:numberValue(get(r,'MonthlyContribution')),targetDate:dateValue(get(r,'TargetDate'))});
        else if(kind==='DEBT'&&name)incoming.debts.push({id,name,balance:numberValue(get(r,'Balance')),apr:numberValue(get(r,'APR')),minPayment:numberValue(get(r,'MinimumPayment')),extraPayment:numberValue(get(r,'ExtraPayment'))});
        else if(kind==='ASSET'&&name)incoming.assets.push({id,name,value:numberValue(get(r,'Value')),type:String(get(r,'ItemType')||'Asset').trim()});
        else if(kind==='LIABILITY'&&name)incoming.liabilities.push({id,name,value:numberValue(get(r,'Value')),type:String(get(r,'ItemType')||'Liability').trim()});
      });
      if(!incoming.transactions.length&&mode!=='replace-all')throw new Error('No TRANSACTION rows were found.');
      const effectiveMode=hasRecordType?mode:(mode==='append-transactions'?'append-transactions':'replace-transactions');
      if(effectiveMode==='replace-all'){
        const defaults=sampleState(),keep={theme:state.settings.theme,layout:state.settings.layout,tutorialCompleted:state.settings.tutorialCompleted,showTips:state.settings.showTips};
        state={...defaults,settings:{...defaults.settings,...keep,...incoming.settings},members:incoming.members,accounts:incoming.accounts,categories:incoming.categories,incomeCategories:incoming.incomeCategories,budgets:incoming.budgets,transactions:incoming.transactions,bills:incoming.bills,goals:incoming.goals,debts:incoming.debts,assets:incoming.assets,liabilities:incoming.liabilities,recommendations:[]};
        if(!state.members.length)state.members=['Household'];
        if(!state.categories.length){const names=new Set([...Object.keys(state.budgets),...state.transactions.map(t=>t.category),...state.bills.map(b=>b.category)].filter(Boolean));state.categories=[...names].map(name=>({name,group:name==='Savings'||name==='Debt Payments'?'Savings':'Need'}));}
        if(!state.incomeCategories.length)state.incomeCategories=defaults.incomeCategories;
      }else if(effectiveMode==='replace-transactions')state.transactions=incoming.transactions;
      else incoming.transactions.forEach(t=>{if(state.transactions.some(x=>x.id===t.id))t.id=uid();state.transactions.push(t)});
      selectedYear=state.settings.year||selectedYear;applyAppearance();populateSelectors();saveState(DEMO_MODE?'CSV imported for this demo session':'CSV data imported');closeModal();navigate('dashboard');
      const summary=hasRecordType?`${incoming.transactions.length} transactions, ${incoming.bills.length} bills, ${incoming.goals.length} goals, ${incoming.debts.length} debts`:`${incoming.transactions.length} transactions imported; other sections kept`;
      setTimeout(()=>showToast(summary),250);
    }catch(err){console.error(err);showToast(err.message||'Could not import this CSV')}};
    reader.readAsText(file);
  }

  function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);}
  function resetSample(){if(!confirm('Restore the original demonstration data? Current data will be replaced.'))return;state=sampleState();selectedYear=state.settings.year;selectedMonth=6;populateSelectors();saveState('Sample data restored');navigate('dashboard');}
  function clearData(){if(!confirm('Clear all financial records and create a blank household? Export a backup first if needed.'))return;const currentTheme=state.settings.theme,currentLayout=state.settings.layout;const clean=sampleState();clean.settings.householdName='New Family Household';clean.settings.theme=currentTheme;clean.settings.layout=currentLayout;clean.members=['Household'];clean.accounts=[];clean.transactions=[];clean.bills=[];clean.goals=[];clean.debts=[];clean.assets=[];clean.liabilities=[];clean.settings.setupComplete=false;clean.settings.tutorialCompleted=false;clean.settings.backupCreated=false;clean.settings.showTips=true;state=clean;selectedYear=today.getFullYear();selectedMonth=today.getMonth();applyAppearance();populateSelectors();saveState('All records cleared');wizardStep=0;navigate('setup');}
  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2200)}

  init();
})();
